# @feature_category: artifact_registry
#import "~/graphql_shared/fragments/page_info.fragment.graphql"

query getArtifactRegistryRepositoryPackages(
  $organizationId: OrganizationsOrganizationID!
  $name: String!
  $first: Int
  $last: Int
  $before: String
  $after: String
) {
  organization(id: $organizationId) {
    id
    # The paging arguments repeat here because Apollo prunes only the @client field's own
    # variables; on `packages` alone they reach the server unused and it rejects the query.
    artifactRegistryRepository(
      name: $name
      first: $first
      last: $last
      before: $before
      after: $after
    ) @client {
      name
      packages(first: $first, last: $last, before: $before, after: $after) {
        nodes {
          ... on ArtifactRegistryMavenPackage {
            id
            groupId
            artifactId
          }
          ... on ArtifactRegistryNpmPackage {
            id
            name
            scope
            versionsCount
          }
        }
        pageInfo {
          ...PageInfo
        }
      }
    }
  }
}
