# @feature_category: artifact_registry

# Entirely @client: the Artifact Registry mutation does not exist in the schema yet,
# so graphql-verify reports this document as a client query and skips it. Removing the
# directive is the only change needed once the backend lands. The alias keeps the
# concrete mutation name out of the component.
#
# The payload selects the whole repository so Apollo normalizes it onto the entry the
# list already cached — `cache_config.js` keys the type on `name` — which is what
# patches the repository in place without an explicit cache update.
mutation updateArtifactRegistryRepository($input: LocalArtifactRegistryRepositoryUpdateInput!) {
  updateRepository: artifactRegistryRepositoryUpdate(input: $input) @client {
    repository {
      name
      format
      kind
      visibility
      description
    }
    errors
  }
}
