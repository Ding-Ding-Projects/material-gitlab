# @feature_category: artifact_registry

# Entirely @client: the Artifact Registry mutation does not exist in the schema yet,
# so graphql-verify reports this document as a client query and skips it. Removing the
# directive is the only change needed once the backend lands. The alias keeps the
# concrete mutation name out of the component.
#
# The payload selects `errors` alone. A deleted repository has nothing left to return,
# and the cache is corrected by eviction rather than by normalizing a payload.
mutation deleteArtifactRegistryRepository($input: LocalArtifactRegistryRepositoryDeleteInput!) {
  deleteRepository: artifactRegistryRepositoryDelete(input: $input) @client {
    errors
  }
}
