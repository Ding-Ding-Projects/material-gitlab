<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0" rel="stylesheet">
<style>
body{margin:0;font-family:'Google Sans Text',sans-serif;
--surf:#f4effa;--surfc:#ece4f6;--surfch:#e0d5f2;--surfcl:#faf6ff;--onsurf:#1d1b20;--onsurfv:#49454f;
--prim:#6750c4;--onprim:#ffffff;--primc:#e8def8;--onprimc:#4f378b;--sec:#d6c9f0;--outl:#cac4d0;--outlv:#e7e0ec;
--err:#b3261e;--errc:#f9dedc;--good:#1a7f37;--goodc:#dcf2e3;--warn:#9a6700;--warnc:#fff3d0;--card:#ffffff;--scrim:rgba(29,27,32,.35)}
body.dark{--surf:#141218;--surfc:#211f26;--surfch:#2b2831;--surfcl:#1b1922;--onsurf:#e6e0e9;--onsurfv:#cac4d0;
--prim:#cfbdfe;--onprim:#381e72;--primc:#4f378b;--onprimc:#e8def8;--sec:#4a4458;--outl:#49454f;--outlv:#332f3a;
--err:#f2b8b5;--errc:#5c1a17;--good:#7fd79a;--goodc:#1c3a27;--warn:#e2c46d;--warnc:#3d3012;--card:#211f26;--scrim:rgba(0,0,0,.5)}
a{color:var(--prim);text-decoration:none}a:hover{color:var(--onprimc)}
input::placeholder,textarea::placeholder{color:var(--onsurfv);opacity:.7}
.material-symbols-outlined{font-variation-settings:'opsz' 20,'wght' 400;font-size:20px;user-select:none}
</style>
</helmet>
<div style="display:flex;height:100vh;background:var(--surf);color:var(--onsurf);overflow:hidden">
  <dc-import name="Sidebar" active="Milestones" hint-size="248px,100%" style="height:100%"></dc-import>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header data-screen-label="Top bar" style="display:flex;align-items:center;gap:12px;padding:12px 24px 8px">
      <div style="flex:1;max-width:600px;display:flex;align-items:center;gap:10px;background:var(--surfc);border-radius:999px;padding:8px 8px 8px 18px;color:var(--onsurfv)">
        <span class="material-symbols-outlined">search</span>
        <input onInput="{{ setSearch }}" value="{{ search }}" placeholder="{{ searchPlaceholder }}" style="border:none;outline:none;background:transparent;font:inherit;color:var(--onsurf);flex:1">
        <div onClick="{{ toggleRegexMode }}" title="Regex mode" style="padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;font-family:monospace;background:{{ regexBg }};color:{{ regexFg }}">.*</div>
        <div onClick="{{ openRegexBuilder }}" title="Regex builder" style="width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:var(--surfch)"><span class="material-symbols-outlined" style="font-size:18px">construction</span></div>
      </div>
      <div onClick="{{ openPalette }}" title="Command palette (Ctrl+Shift+F)" style="width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--onsurfv)" style-hover="background:var(--surfch)"><span class="material-symbols-outlined">keyboard_command_key</span></div>
      <div onClick="{{ toggleDark }}" title="Toggle theme" style="width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--onsurfv)" style-hover="background:var(--surfch)"><span class="material-symbols-outlined">{{ themeIcon }}</span></div>
      <div style="width:36px;height:36px;border-radius:999px;background:var(--primc);color:var(--onprimc);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">JD</div>
    </header>
    <div style="display:flex;align-items:center;gap:12px;padding:8px 24px">
      <h1 style="margin:0;font-family:'Google Sans';font-size:24px;font-weight:500">Plan</h1>
      <div style="display:flex;background:var(--surfc);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap">
        <sc-for list="{{ tabs }}" as="tb" hint-placeholder-count="4">
          <div onClick="{{ tb.pick }}" style="padding:7px 16px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;background:{{ tb.bg }};color:{{ tb.fg }}">{{ tb.label }}</div>
        </sc-for>
      </div>
    </div>
    <main style="flex:1;overflow-y:auto;padding:8px 24px 24px;display:flex;flex-direction:column;gap:14px">
      <sc-if value="{{ isWiki }}" hint-placeholder-val="{{ false }}">
        <div data-screen-label="Wiki" style="display:grid;grid-template-columns:250px 1fr;gap:14px;max-width:980px;align-items:start">
          <div style="background:var(--surfc);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:2px">
            <sc-for list="{{ wikiPages }}" as="wp" hint-placeholder-count="4">
              <div onClick="{{ wp.pick }}" style="padding:9px 12px;border-radius:10px;font-size:13px;cursor:pointer;background:{{ wp.bg }}" style-hover="background:var(--surfch)">{{ wp.title }}</div>
            </sc-for>
          </div>
          <div style="background:var(--card);border-radius:var(--card-r,20px);padding:22px 26px;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:10px">
            <div style="display:flex;align-items:center;gap:10px">
              <h2 style="margin:0;font-family:'Google Sans';font-size:19px;font-weight:500;flex:1">{{ wikiTitle }}</h2>
              <div onClick="{{ toggleWikiEdit }}" style="display:flex;align-items:center;gap:6px;border:1px solid var(--outl);border-radius:999px;padding:7px 16px;font-size:12.5px;font-weight:500;cursor:pointer;color:var(--onprimc)"><span class="material-symbols-outlined" style="font-size:16px">{{ wikiEditIcon }}</span>{{ wikiEditLabel }}</div>
            </div>
            <sc-if value="{{ wikiEditing }}" hint-placeholder-val="{{ false }}">
              <textarea onInput="{{ setWikiBody }}" value="{{ wikiBody }}" rows="10" style="border:1px solid var(--outl);border-radius:12px;padding:12px 14px;font-family:monospace;font-size:13px;line-height:1.7;background:transparent;color:var(--onsurf);outline:none;resize:vertical"></textarea>
            </sc-if>
            <sc-if value="{{ wikiReading }}" hint-placeholder-val="{{ true }}">
              <div style="font-size:13.5px;line-height:1.75;color:var(--onsurfv);white-space:pre-wrap">{{ wikiBody }}</div>
            </sc-if>
            <div style="font-size:11.5px;color:var(--onsurfv);border-top:1px solid var(--outlv);padding-top:10px">{{ wikiMeta }}</div>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{ showRows }}" hint-placeholder-val="{{ true }}">
        <div style="background:var(--card);border-radius:var(--card-r,20px);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);max-width:980px">
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
            <div style="display:flex;align-items:center;gap:14px;padding:13px 20px;border-bottom:1px solid var(--outlv)">
              <span class="material-symbols-outlined" style="color:{{ r.iconColor }};font-size:19px">{{ r.icon }}</span>
              <div style="flex:1;min-width:0">
                <div style="font-weight:500;font-size:13.5px">{{ r.title }}</div>
                <div style="font-size:12px;color:var(--onsurfv);margin-top:1px">{{ r.sub }}</div>
              </div>
              <sc-if value="{{ r.pct }}" hint-placeholder-val="{{ false }}">
                <div style="width:130px;display:flex;flex-direction:column;gap:4px">
                  <div style="height:6px;border-radius:999px;background:var(--surfch);overflow:hidden"><div style="height:100%;border-radius:999px;background:var(--prim);width:{{ r.pct }}"></div></div>
                  <span style="font-size:11px;color:var(--onsurfv)">{{ r.pct }}</span>
                </div>
              </sc-if>
              <sc-if value="{{ r.badge }}" hint-placeholder-val="{{ false }}">
                <span style="font-size:11.5px;font-weight:500;padding:3px 12px;border-radius:999px;background:{{ r.badgeBg }};color:{{ r.badgeFg }}">{{ r.badge }}</span>
              </sc-if>
              <span style="font-size:12px;color:var(--onsurfv)">{{ r.meta }}</span>
            </div>
          </sc-for>
          <sc-if value="{{ emptyList }}" hint-placeholder-val="{{ false }}">
            <div style="padding:36px;text-align:center;color:var(--onsurfv);font-size:13.5px">Nothing matches.</div>
          </sc-if>
        </div>
      </sc-if>
    </main>
  </div>
  <sc-if value="{{ regexOpen }}" hint-placeholder-val="{{ false }}">
    <dc-import name="Regex Builder" initial="{{ regexInitial }}" corpus="{{ regexCorpus }}" corpus-title="Matches" on-apply="{{ applyRegex }}" on-close="{{ closeRegexBuilder }}" hint-size="0px,0px"></dc-import>
  </sc-if>
  <sc-if value="{{ paletteOpen }}" hint-placeholder-val="{{ false }}">
    <dc-import name="Command Palette" actions="{{ paletteActions }}" on-close="{{ closePalette }}" hint-size="0px,0px"></dc-import>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  // Tabs mirror plan_menu.rb beyond issues/boards: milestones, iterations, project_wiki, requirements
  state = {
    dark: false, search: '', regexMode: false, regexOpen: false, paletteOpen: false, tab: 'Milestones',
    wikiPage: 0, wikiEditing: false,
    milestones: [
      {name:'17.3 — Regex everywhere', sub:'Aug 1 – Aug 31 · 11 issues', pct: 45, state:'active'},
      {name:'17.2 — Material milestone', sub:'Jul 1 – Jul 31 · 34 issues', pct: 100, state:'closed'},
      {name:'17.4 — Agent memory GA', sub:'Sep 1 – Sep 30 · 10 issues', pct: 10, state:'upcoming'}
    ],
    iterations: [
      {name:'Sprint 34', sub:'Aug 11 – Aug 22 · current', pct: 38, state:'active'},
      {name:'Sprint 33', sub:'Jul 28 – Aug 8', pct: 92, state:'closed'},
      {name:'Sprint 35', sub:'Aug 25 – Sep 5', pct: 0, state:'upcoming'}
    ],
    requirements: [
      {name:'REQ-1 Search accepts valid ECMAScript regex', sub:'satisfied by search/regex.spec.js', status:'satisfied'},
      {name:'REQ-2 Board drag persists ordering across reload', sub:'verified in nightly run', status:'satisfied'},
      {name:'REQ-3 All badges meet WCAG AA in both themes', sub:'failing for warning badge in dark', status:'failed'},
      {name:'REQ-4 Palette reachable from every surface', sub:'awaiting test', status:'missing'}
    ],
    wiki: [
      {title:'Home', body:'Welcome to the phoenix-api wiki.\n\nStart with Development setup, then read the MD3 rewrite notes. The regex search spec documents the builder contract shared by every surface.', meta:'last edited by dweiss · 3h ago'},
      {title:'Development setup', body:'1. bundle install && yarn install\n2. bin/rails db:setup\n3. bin/rails s + yarn dev\n\nUse mise for toolchain pins. Runner images match .gitlab-ci.yml.', meta:'last edited by junpark · 2d ago'},
      {title:'MD3 rewrite notes', body:'Token layer lives in app/assets/stylesheets/tokens.\n\nRules:\n- container pairs for all status colors\n- pill nav, 20px card radius\n- no raw hex outside the token layer', meta:'last edited by dweiss · 1d ago'},
      {title:'Regex search spec', body:'Every search bar exposes:\n- a .* mode toggle\n- the shared builder (flags i g m s, snippets, live preview, capture groups)\n- invalid patterns fall back to substring match and surface an error chip', meta:'last edited by junpark · 5h ago'}
    ]
  };
  componentDidMount() {
    this._key = (e) => {
      if (e.ctrlKey && e.shiftKey && (e.key === 'F' || e.key === 'f')) { e.preventDefault(); this.setState({paletteOpen: true}); }
      if (e.key === 'Escape') this.setState({paletteOpen: false, regexOpen: false});
    };
    window.addEventListener('keydown', this._key);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this._key); }
  matcher() {
    const q = this.state.search;
    if (!q) return () => true;
    if (this.state.regexMode) { try { const re = new RegExp(q, 'i'); return (t) => re.test(t); } catch { return () => true; } }
    const lq = q.toLowerCase(); return (t) => t.toLowerCase().includes(lq);
  }
  renderVals() {
    const s = this.state, set = (o) => this.setState(o);
    const m = this.matcher();
    const stMeta = {active:['var(--goodc)','var(--good)'], closed:['var(--surfch)','var(--onsurfv)'], upcoming:['var(--primc)','var(--onprimc)'], satisfied:['var(--goodc)','var(--good)'], failed:['var(--errc)','var(--err)'], missing:['var(--warnc)','var(--warn)']};
    let rows = [];
    const mkRow = (x, icon) => ({icon, iconColor:'var(--prim)', title:x.name, sub:x.sub, pct: x.pct !== undefined ? x.pct + '%' : null,
      badge:x.state || x.status, badgeBg:stMeta[x.state || x.status][0], badgeFg:stMeta[x.state || x.status][1], meta:''});
    if (s.tab === 'Milestones') rows = s.milestones.filter(x => m(x.name)).map(x => mkRow(x, 'flag'));
    if (s.tab === 'Iterations') rows = s.iterations.filter(x => m(x.name)).map(x => mkRow(x, 'update'));
    if (s.tab === 'Requirements') rows = s.requirements.filter(x => m(x.name)).map(x => mkRow(x, 'fact_check'));
    const wp = s.wiki[s.wikiPage];
    return {
      search: s.search, setSearch: (e) => set({search: e.target.value}),
      searchPlaceholder: s.regexMode ? 'Regex search — ' + s.tab.toLowerCase() : 'Search ' + s.tab.toLowerCase(),
      regexBg: s.regexMode ? 'var(--prim)' : 'var(--surfch)', regexFg: s.regexMode ? 'var(--onprim)' : 'var(--onsurfv)',
      toggleRegexMode: () => set({regexMode: !s.regexMode}),
      regexOpen: s.regexOpen, regexInitial: s.regexMode ? s.search : '',
      regexCorpus: [...s.milestones.map(x => x.name), ...s.iterations.map(x => x.name), ...s.requirements.map(x => x.name), ...s.wiki.map(x => x.title)],
      openRegexBuilder: () => set({regexOpen: true}), closeRegexBuilder: () => set({regexOpen: false}),
      applyRegex: (p) => set({search: p, regexMode: true, regexOpen: false}),
      paletteOpen: s.paletteOpen, openPalette: () => set({paletteOpen: true}), closePalette: () => set({paletteOpen: false}),
      paletteActions: [{label:'Toggle dark theme', icon:'dark_mode', run: () => { document.body.classList.toggle('dark', !s.dark); set({dark: !s.dark}); }},
        ...['Milestones','Iterations','Wiki','Requirements'].map(t => ({label:'Plan: ' + t, icon:'flag', run: () => set({tab: t})}))],
      toggleDark: () => { document.body.classList.toggle('dark', !s.dark); set({dark: !s.dark}); },
      themeIcon: s.dark ? 'light_mode' : 'dark_mode',
      tabs: ['Milestones','Iterations','Wiki','Requirements'].map(t => ({label:t, pick:() => set({tab:t}),
        bg: s.tab === t ? 'var(--primc)' : 'transparent', fg: s.tab === t ? 'var(--onprimc)' : 'var(--onsurfv)'})),
      isWiki: s.tab === 'Wiki', showRows: s.tab !== 'Wiki',
      wikiPages: s.wiki.map((w, i) => ({title: w.title, bg: i === s.wikiPage ? 'var(--sec)' : 'transparent', pick: () => set({wikiPage: i, wikiEditing: false})})),
      wikiTitle: wp.title, wikiBody: wp.body, wikiMeta: wp.meta,
      wikiEditing: s.wikiEditing, wikiReading: !s.wikiEditing,
      wikiEditIcon: s.wikiEditing ? 'check' : 'edit', wikiEditLabel: s.wikiEditing ? 'Save' : 'Edit',
      toggleWikiEdit: () => set({wikiEditing: !s.wikiEditing, wiki: s.wikiEditing ? s.wiki.map((w, i) => i === s.wikiPage ? {...w, meta: 'last edited by you · just now'} : w) : s.wiki}),
      setWikiBody: (e) => set({wiki: s.wiki.map((w, i) => i === s.wikiPage ? {...w, body: e.target.value} : w)}),
      rows, emptyList: rows.length === 0 && s.tab !== 'Wiki'
    };
  }
}
</script>
</body>
</html>
