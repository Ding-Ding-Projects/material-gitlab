<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0" rel="stylesheet">
<style>
body{margin:0;font-family:'Google Sans Text',sans-serif;
--surf:#f4eff
a;--surfc:#ece4f6;--surfch:#e0d5f2;--surfcl:#faf6ff;--onsurf:#1d1b20;--onsurfv:#49454f;
--prim:#6750c4;--onprim:#ffffff;--primc:#e8def8;--onprimc:#4f378b;--sec:#d6c9f0;--outl:#cac4d0;--outlv:#e7e0ec;
--err:#b3261e;--errc:#f9dedc;--good:#1a7f37;--goodc:#dcf2e3;--warn:#9a6700;--warnc:#fff3d0;--card:#ffffff}
body.dark{--surf:#141218;--surfc:#211f26;--surfch:#2b2831;--surfcl:#1b1922;--onsurf:#e6e0e9;--onsurfv:#cac4d0;
--prim:#cfbdfe;--onprim:#381e72;--primc:#4f378b;--onprimc:#e8def8;--sec:#4a4458;--outl:#49454f;--outlv:#332f3a;
--err:#f2b8b5;--errc:#5c1a17;--good:#7fd79a;--goodc:#1c3a27;--warn:#e2c46d;--warnc:#3d3012;--card:#211f26}
a{color:var(--prim);text-decoration:none}a:hover{color:var(--onprimc)}
input::placeholder{color:var(--onsurfv);opacity:.7}
.material-symbols-outlined{font-variation-settings:'opsz' 20,'wght' 400;font-size:20px;user-select:none}
</style>
</helmet>
<div style="display:flex;min-height:100vh;background:var(--surf);color:var(--onsurf);align-items:center;justify-content:center;padding:24px;box-sizing:border-box">
  <div style="display:flex;gap:0;background:var(--card);border-radius:28px;box-shadow:0 4px 24px rgba(0,0,0,.12);overflow:hidden;max-width:880px;width:100%">
    <div data-screen-label="Brand panel" style="flex:1;background:var(--prim);color:var(--onprim);padding:48px 40px;display:flex;flex-direction:column;gap:18px;justify-content:center">
      <div style="width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-family:'Google Sans';font-weight:700;font-size:26px">G</div>
      <div style="font-family:'Google Sans';font-size:26px;font-weight:500;line-height:1.3">GitLab M3</div>
      <div style="font-size:14px;line-height:1.6;opacity:.85">One DevSecOps platform, redesigned in Material 3. Plan, code, build, secure, deploy — with agent memory built in.</div>
    </div>
    <div data-screen-label="Sign-in form" style="flex:1.1;padding:48px 44px;display:flex;flex-direction:column;gap:14px">
      <h1 style="margin:0;font-family:'Google Sans';font-size:22px;font-weight:500">{{ heading }}</h1>
      <sc-if value="{{ error }}" hint-placeholder-val="{{ false }}">
        <div style="background:var(--errc);color:var(--err);border-radius:12px;padding:10px 14px;font-size:13px">{{ error }}</div>
      </sc-if>
      <sc-if value="{{ signedIn }}" hint-placeholder-val="{{ false }}">
        <div style="background:var(--goodc);color:var(--good);border-radius:12px;padding:10px 14px;font-size:13px">Signed in as {{ username }} — <a href="Issues.dc.html">continue to Issues</a></div>
      </sc-if>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--onsurfv)">Username or email
        <input onInput="{{ setUser }}" value="{{ username }}" placeholder="jdoe@acme.dev" style="border:1px solid var(--outl);border-radius:12px;padding:12px 14px;font:inherit;font-size:14px;background:transparent;color:var(--onsurf);outline:none">
      </label>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--onsurfv)">Password
        <div style="display:flex;align-items:center;border:1px solid var(--outl);border-radius:12px;padding:0 6px 0 14px">
          <input onInput="{{ setPass }}" onKeyDown="{{ passKey }}" value="{{ password }}" type="{{ passType }}" placeholder="••••••••" style="border:none;flex:1;padding:12px 0;font:inherit;font-size:14px;background:transparent;color:var(--onsurf);outline:none">
          <div onClick="{{ toggleReveal }}" style="width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--onsurfv)"><span class="material-symbols-outlined" style="font-size:18px">{{ eyeIcon }}</span></div>
        </div>
      </label>
      <div style="display:flex;align-items:center;gap:8px">
        <div onClick="{{ toggleRemember }}" style="width:20px;height:20px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;border:2px solid {{ rememberBorder }};background:{{ rememberBg }}">
          <sc-if value="{{ remember }}" hint-placeholder-val="{{ false }}"><span class="material-symbols-outlined" style="font-size:15px;color:var(--onprim)">check</span></sc-if>
        </div>
        <span style="font-size:13px">Remember me</span>
        <a href="#" style="margin-left:auto;font-size:13px">Forgot password?</a>
      </div>
      <div onClick="{{ signIn }}" style="background:var(--prim);color:var(--onprim);border-radius:999px;padding:13px;text-align:center;font-weight:500;font-size:14.5px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2)">Sign in</div>
      <div style="display:flex;align-items:center;gap:12px;color:var(--onsurfv);font-size:12px"><div style="flex:1;height:1px;background:var(--outlv)"></div>or<div style="flex:1;height:1px;background:var(--outlv)"></div></div>
      <div style="display:flex;gap:8px">
        <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--outl);border-radius:999px;padding:11px;font-size:13px;font-weight:500;cursor:pointer;color:var(--onprimc)"><span class="material-symbols-outlined" style="font-size:18px">key</span>SSO</div>
        <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--outl);border-radius:999px;padding:11px;font-size:13px;font-weight:500;cursor:pointer;color:var(--onprimc)"><span class="material-symbols-outlined" style="font-size:18px">badge</span>LDAP</div>
      </div>
      <div style="font-size:13px;color:var(--onsurfv);text-align:center">New here? <a href="#">Register now</a></div>
    </div>
  </div>
</div></x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { username: '', password: '', reveal: false, remember: true, error: null, signedIn: false };
  renderVals() {
    const s = this.state, set = (o) => this.setState(o);
    const doSignIn = () => {
      if (!s.username.trim() || !s.password) { set({error: 'Enter a username and password.', signedIn: false}); return; }
      set({error: null, signedIn: true});
    };
    return {
      heading: 'Sign in to GitLab M3',
      username: s.username, setUser: (e) => set({username: e.target.value, error: null}),
      password: s.password, setPass: (e) => set({password: e.target.value, error: null}),
      passKey: (e) => { if (e.key === 'Enter') doSignIn(); },
      passType: s.reveal ? 'text' : 'password', eyeIcon: s.reveal ? 'visibility_off' : 'visibility',
      toggleReveal: () => set({reveal: !s.reveal}),
      remember: s.remember, toggleRemember: () => set({remember: !s.remember}),
      rememberBorder: s.remember ? 'var(--prim)' : 'var(--outl)', rememberBg: s.remember ? 'var(--prim)' : 'transparent',
      error: s.error, signedIn: s.signedIn, signIn: doSignIn
    };
  }
}
</script>
</body>
</html>
