<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Google Sans Text','Google Sans',sans-serif}a{color:#6750c4}a:hover{color:#4f378b}</style>
</helmet>
<div style="display:flex;height:100vh;background:#f4effa;color:#1d1b20">
  <nav style="width:256px;background:#ece4f6;padding:12px;display:flex;flex-direction:column;gap:4px;border-radius:0 16px 16px 0">
    <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;font-family:'Google Sans';font-weight:700;font-size:16px"><div style="width:28px;height:28px;border-radius:8px;background:#6750c4"></div>GitLab M3</div>
    <div style="padding:10px 16px;border-radius:999px;background:#d6c9f0;font-weight:500;font-size:14px">Issues</div>
    <div style="padding:10px 16px;border-radius:999px;font-size:14px" style-hover="background:#e0d5f2">Merge requests</div>
    <div style="padding:10px 16px;border-radius:999px;font-size:14px" style-hover="background:#e0d5f2">Pipelines</div>
    <div style="padding:10px 16px;border-radius:999px;font-size:14px" style-hover="background:#e0d5f2">Boards</div>
  </nav>
  <main style="flex:1;padding:24px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;align-items:center;gap:12px">
      <h1 style="margin:0;font-family:'Google Sans';font-size:24px;font-weight:500">Issues</h1>
      <div style="margin-left:auto;background:#e8def8;border-radius:999px;padding:10px 20px;font-weight:500;font-size:14px;color:#4f378b">New issue</div>
    </div>
    <div style="background:#fff;border-radius:20px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)">
      <div style="font-weight:500">Boards render slow with 500+ cards</div>
      <div style="font-size:13px;color:#49454f;margin-top:4px">#4312 · opened 2d ago</div>
    </div>
    <div style="background:#fff;border-radius:20px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)">
      <div style="font-weight:500">Pipeline badge contrast in dark mode</div>
      <div style="font-size:13px;color:#49454f;margin-top:4px">#4308 · opened 3d ago</div>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
