.pane>*{animation:rise .5s cubic-bezier(.38,1.21,.22,1) both}
.pane>*:nth-child(2){animation-delay:.05s}.pane>*:nth-child(3){animation-delay:.1s}.pane>*:nth-child(4){animation-delay:.15s}.pane>*:nth-child(5){animation-delay:.2s}.pane>*:nth-child(6){animation-delay:.25s}
.rail .row,.list .row,.tbl tbody tr,.grid4>*,.grid3>*,.grid2>*{animation:rise .5s cubic-bezier(.38,1.21,.22,1) both}
.rail .row:nth-child(2),.list .row:nth-child(2),.tbl tr:nth-child(2),.grid4>*:nth-child(2),.grid3>*:nth-child(2),.grid2>*:nth-child(2){animation-delay:.06s}
.rail .row:nth-child(3),.list .row:nth-child(3),.tbl tr:nth-child(3),.grid4>*:nth-child(3),.grid3>*:nth-child(3){animation-delay:.12s}
.rail .row:nth-child(4),.list .row:nth-child(4),.tbl tr:nth-child(4),.grid4>*:nth-child(4){animation-delay:.18s}

.rail::before{transform-origin:top;animation:grow .7s .1s cubic-bezier(.34,.8,.34,1) both}
.row{transition:background-color .2s cubic-bezier(.34,.8,.34,1),transform .35s cubic-bezier(.42,1.67,.21,.9),border-radius .35s cubic-bezier(.42,1.67,.21,.9)}

.nav:active,.chip:active,.ib:active{transform:scale(.94);border-radius:12px}
.nav.on{animation:pop .5s cubic-bezier(.42,1.67,.21,.9) both}
.tab.on::after{animation:accent .45s cubic-bezier(.42,1.67,.21,.9) both;width:auto}
.tab-b{animation:tabIn .4s cubic-bezier(.38,1.21,.22,1) both}
.tab-b:nth-child(2){animation-delay:.04s}.tab-b:nth-child(3){animation-delay:.08s}.tab-b:nth-child(4){animation-delay:.12s}.tab-b:nth-child(5){animation-delay:.16s}.tab-b:nth-child(6){animation-delay:.2s}
.accent{animation:accent .6s .25s cubic-bezier(.42,1.67,.21,.9) both}

.sg svg{transition:transform .35s cubic-bezier(.42,1.67,.21,.9)}
.sg:hover svg{transform:rotate(25deg) scale(1.12)}
.sg-run svg{animation:spin 6s linear infinite}
.sg-ok svg{animation:breathe 3.2s ease-in-out infinite}
.sg-err svg{animation:wobble .6s .4s cubic-bezier(.42,1.67,.21,.9) 2}
polyline{stroke-dasharray:1400;animation:draw 1.4s .2s cubic-bezier(.34,.8,.34,1) both}
.barsv span{transform-origin:bottom;animation:grow .7s cubic-bezier(.38,1.21,.22,1) both}
.barsv span:nth-child(2n){animation-delay:.05s}.barsv span:nth-child(3n){animation-delay:.1s}.barsv span:nth-child(4n){animation-delay:.15s}
.bar span{transform-origin:left;animation:grow .8s .2s cubic-bezier(.38,1.21,.22,1) both}
.kpi{animation:rise .6s .15s cubic-bezier(.42,1.67,.21,.9) both}
.toast{animation:toastIn .6s .8s cubic-bezier(.38,1.21,.22,1) both}
.toast .drain{position:absolute;left:12px;right:12px;bottom:4px;height:3px;border-radius:3px;background:var(--inverse-primary);transform-origin:left;animation:drain 6s 1.4s linear both}
.dimsum{animation:pop .7s 1.2s cubic-bezier(.42,1.67,.21,.9) both}
.dlg{animation:dlgIn .55s cubic-bezier(.38,1.21,.22,1) both}
.scrim{animation:fade .3s both}
.timer .colon{animation:blink 1s steps(1) infinite}
.badge{animation:pop .5s .6s cubic-bezier(.42,1.67,.21,.9) both}
.b{transition:border-radius .35s cubic-bezier(.42,1.67,.21,.9),transform .35s cubic-bezier(.42,1.67,.21,.9),box-shadow .2s,filter .2s}
.b:hover{transform:translateY(-1px);box-shadow:var(--shadow-1)}
.sw::after{transition:all .35s cubic-bezier(.42,1.67,.21,.9)}
.side .ctx{transition:transform .35s cubic-bezier(.42,1.67,.21,.9)}
.side .ctx:hover{transform:translateY(-2px) rotate(-.4deg)}
.mark{animation:pop .7s cubic-bezier(.42,1.67,.21,.9) both}
.skel{background:linear-gradient(90deg,var(--row) 0,var(--surface-container-high) 50%,var(--row) 100%);background-size:400px 100%;animation:shimmer 1.4s linear infinite}
@media (prefers-reduced-motion: reduce){.root *,.root *::before,.root *::after{animation:none!important;transition:none!important}}

.helpdot{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--on-surface-variant)}
