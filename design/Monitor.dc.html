<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0" rel="stylesheet">
<style>
body{margin:0;font-family:'Google Sans Text',sans-serif;
--surf:#f4effa;--surfc:#ece4f6;--surfch:#e0d5f2;--surfcl:#faf6ff;--onsurf:#1d1b20;--onsurfv:#49454f;
--prim:#6750c4;--onprim:#ffffff;--primc:#e8def8;--onprimc:#4f378b;--sec:#d6c9f0;--outl:#cac4d0;--outlv:#e7e0ec;
--err:#b3261e;--errc:#f9dedc;--good:#1a7f37;--goodc:#dcf2e3;--warn:#9a6700;--warnc:#fff3d0;--card:#ffffff;--scrim:rgba(29,27,32,.35)}
body.dark{--surf:#141218;--surfc:#211f26;--surfch:#2b2831;--surfcl:#1b1922;--onsurf:#e6e0e9;--onsurfv:#cac4d0;
--prim:#cfbdfe;--onprim:#381e72;--primc:#4f378b;--onprimc:#e8def8;--sec:#4a4458;--outl:#49454f;--outlv:#332f3a;
--err:#f2b8b5;--errc:#5c1a17;--good:#7fd79a;--goodc:#1c3a27;--warn:#e2c46d;--warnc:#3d3012;--card:#211f26;--scrim:rgba(0,0,0,.5)}
a{color:var(--prim);text-decoration:none}a:hover{color:var(--onprimc)}
input::placeholder{color:var(--onsurfv);opacity:.7}
.material-symbols-outlined{font-variation-settings:'opsz' 20,'wght' 400;font-size:20px;user-select:none}
</style>
</helmet>
<div style="display:flex;height:100vh;background:var(--surf);color:var(--onsurf);overflow:hidden">
  <dc-import name="Sidebar" active="Incidents" hint-size="248px,100%" style="height:100%"></dc-import>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header data-screen-label="Top bar" style="display:flex;align-items:center;gap:12px;padding:12px 24px 8px">
      <div style="flex:1;max-width:600px;display:flex;align-items:center;gap:10px;background:var(--surfc);border-radius:999px;padding:8px 8px 8px 18px;color:var(--onsurfv)">
        <span class="material-symbols-outlined">search</span>
        <input onInput="{{ setSearch }}" value="{{ search }}" placeholder="{{ searchPlaceholder }}" style="border:none;outline:none;background:transparent;font:inherit;color:var(--onsurf);flex:1">
        <div onClick="{{ toggleRegexMode }}" title="Regex mode" style="padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;font-family:monospace;background:{{ regexBg }};color:{{ regexFg }}">.*</div>
        <div onClick="{{ openRegexBuilder }}" title="Regex builder" style="width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:var(--surfch)"><span class="material-symbols-outlined" style="font-size:18px">construction</span></div>
      </div>
      <div onClick="{{ openPalette }}" title="Command palette (Ctrl+Shift+F)" style="width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--onsurfv)" style-hover="background:var(--surfch)"><span class="material-symbols-outlined">keyboard_command_key</span></div>
      <div onClick="{{ toggleDark }}" title="Toggle theme" style="width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--onsurfv)" style-hover="background:var(--surfch)"><span class="material-symbols-outlined">{{ themeIcon }}</span></div>
      <div style="width:36px;height:36px;border-radius:999px;background:var(--primc);color:var(--onprimc);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">JD</div>
    </header>
    <div style="display:flex;align-items:center;gap:12px;padding:8px 24px">
      <h1 style="margin:0;font-family:'Google Sans';font-size:24px;font-weight:500">Monitor</h1>
      <div style="display:flex;background:var(--surfc);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap">
        <sc-for list="{{ tabs }}" as="tb" hint-placeholder-count="5">
          <div onClick="{{ tb.pick }}" style="padding:7px 16px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;background:{{ tb.bg }};color:{{ tb.fg }}">{{ tb.label }}</div>
        </sc-for>
      </div>
    </div>
    <main style="flex:1;overflow-y:auto;padding:8px 24px 24px">
      <div style="background:var(--card);border-radius:var(--card-r,20px);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);max-width:980px">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
          <div style="display:flex;align-items:center;gap:14px;padding:13px 20px;border-bottom:1px solid var(--outlv)">
            <span class="material-symbols-outlined" style="color:{{ r.iconColor }};font-size:19px">{{ r.icon }}</span>
            <div style="flex:1;min-width:0">
              <div style="font-weight:500;font-size:13.5px;font-family:{{ r.titleFont }}">{{ r.title }}</div>
              <div style="font-size:12px;color:var(--onsurfv);margin-top:1px">{{ r.sub }}</div>
            </div>
            <sc-if value="{{ r.badge }}" hint-placeholder-val="{{ false }}">
              <span style="font-size:11.5px;font-weight:500;padding:3px 12px;border-radius:999px;background:{{ r.badgeBg }};color:{{ r.badgeFg }}">{{ r.badge }}</span>
            </sc-if>
            <span style="font-size:12px;color:var(--onsurfv)">{{ r.meta }}</span>
            <sc-if value="{{ r.action }}" hint-placeholder-val="{{ false }}">
              <div onClick="{{ r.act }}" style="font-size:12.5px;font-weight:500;color:{{ r.actionColor }};cursor:pointer;border:1px solid var(--outl);border-radius:999px;padding:6px 14px">{{ r.action }}</div>
            </sc-if>
          </div>
        </sc-for>
        <sc-if value="{{ emptyList }}" hint-placeholder-val="{{ false }}">
          <div style="padding:36px;text-align:center;color:var(--onsurfv);font-size:13.5px">Nothing matches.</div>
        </sc-if>
      </div>
    </main>
  </div>
  <sc-if value="{{ regexOpen }}" hint-placeholder-val="{{ false }}">
    <dc-import name="Regex Builder" initial="{{ regexInitial }}" corpus="{{ regexCorpus }}" corpus-title="Matches" on-apply="{{ applyRegex }}" on-close="{{ closeRegexBuilder }}" hint-size="0px,0px"></dc-import>
  </sc-if>
  <sc-if value="{{ paletteOpen }}" hint-placeholder-val="{{ false }}">
    <dc-import name="Command Palette" actions="{{ paletteActions }}" on-close="{{ closePalette }}" hint-size="0px,0px"></dc-import>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  // Tabs mirror monitor_menu.rb: incidents, alert_management, error_tracking, on_call_schedules, service_desk
  state = {
    dark: false, search: '', regexMode: false, regexOpen: false, paletteOpen: false, tab: 'Incidents',
    incidents: [
      {name:'API 5xx spike on /boards endpoints', sub:'#INC-42 · opened from alert · assigned dweiss', sev:'S1', status:'active', when:'25m ago'},
      {name:'Review apps stuck in deploying', sub:'#INC-41 · runner pool exhaustion', sev:'S2', status:'mitigated', when:'4h ago'},
      {name:'Registry GC ran long, pulls slow', sub:'#INC-39 · resolved with GC window change', sev:'S3', status:'resolved', when:'2d ago'}
    ],
    alerts: [
      {name:'HighErrorRate boards-api', sub:'Prometheus · firing 25m · threshold 2%', status:'firing'},
      {name:'PodCrashLooping review-mr-1278', sub:'K8s agent · 6 restarts / 10m', status:'firing'},
      {name:'CertExpiresSoon pages.example.dev', sub:'expires in 13 days', status:'acknowledged'},
      {name:'DiskPressure staging-shared-node-3', sub:'auto-resolved after scale-up', status:'resolved'}
    ],
    errors: [
      {name:'NoMethodError: undefined method `col` for nil', sub:'boards/lists_controller.rb:52 · 214 events · 38 users', when:'first seen 3h ago'},
      {name:'TypeError: range.value is undefined', sub:'virtual_scroll.js:14 · 89 events · 12 users', when:'first seen 2h ago'},
      {name:'ActiveRecord::LockWaitTimeout', sub:'merge_service.rb:88 · 7 events', when:'first seen 1d ago'}
    ],
    oncall: [
      {name:'Primary — Platform', sub:'Rotation weekly · currently dweiss', until:'until Mon 09:00'},
      {name:'Secondary — Platform', sub:'Rotation weekly · currently ohaddad', until:'until Mon 09:00'},
      {name:'Security escalation', sub:'Business hours · currently pnair', until:'until 18:00'}
    ],
    tickets: [
      {name:'Cannot push over SSH from office network', sub:'service-desk+phoenix@acme.dev · from customer', status:'open', when:'1h ago'},
      {name:'Request: raise artifact size limit', sub:'internal requester', status:'open', when:'1d ago'},
      {name:'Broken link in release notes', sub:'resolved by docs MR !1290', status:'closed', when:'3d ago'}
    ]
  };
  componentDidMount() {
    this._key = (e) => {
      if (e.ctrlKey && e.shiftKey && (e.key === 'F' || e.key === 'f')) { e.preventDefault(); this.setState({paletteOpen: true}); }
      if (e.key === 'Escape') this.setState({paletteOpen: false, regexOpen: false});
    };
    window.addEventListener('keydown', this._key);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this._key); }
  matcher() {
    const q = this.state.search;
    if (!q) return () => true;
    if (this.state.regexMode) { try { const re = new RegExp(q, 'i'); return (t) => re.test(t); } catch { return () => true; } }
    const lq = q.toLowerCase(); return (t) => t.toLowerCase().includes(lq);
  }
  renderVals() {
    const s = this.state, set = (o) => this.setState(o);
    const m = this.matcher();
    const meta = {active:['var(--errc)','var(--err)'], mitigated:['var(--warnc)','var(--warn)'], resolved:['var(--goodc)','var(--good)'], firing:['var(--errc)','var(--err)'], acknowledged:['var(--warnc)','var(--warn)'], open:['var(--warnc)','var(--warn)'], closed:['var(--surfch)','var(--onsurfv)']};
    let rows = [];
    if (s.tab === 'Incidents') rows = s.incidents.filter(x => m(x.name + ' ' + x.sub)).map((x, i) => ({
      icon:'e911_emergency', iconColor:meta[x.status][1], title:x.name, titleFont:'inherit', sub:x.sub + ' · ' + x.sev,
      badge:x.status, badgeBg:meta[x.status][0], badgeFg:meta[x.status][1], meta:x.when,
      action:x.status === 'active' ? 'Mitigate' : x.status === 'mitigated' ? 'Resolve' : null, actionColor:'var(--onprimc)',
      act:() => set({incidents: s.incidents.map((y, k) => k === i ? {...y, status: y.status === 'active' ? 'mitigated' : 'resolved'} : y)})}));
    if (s.tab === 'Alerts') rows = s.alerts.filter(x => m(x.name + ' ' + x.sub)).map((x, i) => ({
      icon:'notification_important', iconColor:meta[x.status][1], title:x.name, titleFont:'monospace', sub:x.sub,
      badge:x.status, badgeBg:meta[x.status][0], badgeFg:meta[x.status][1], meta:'',
      action:x.status === 'firing' ? 'Acknowledge' : null, actionColor:'var(--onprimc)',
      act:() => set({alerts: s.alerts.map((y, k) => k === i ? {...y, status:'acknowledged'} : y)})}));
    if (s.tab === 'Errors') rows = s.errors.filter(x => m(x.name + ' ' + x.sub)).map(x => ({
      icon:'error', iconColor:'var(--err)', title:x.name, titleFont:'monospace', sub:x.sub, badge:null, meta:x.when, action:null}));
    if (s.tab === 'On-call') rows = s.oncall.filter(x => m(x.name + ' ' + x.sub)).map(x => ({
      icon:'phone_in_talk', iconColor:'var(--prim)', title:x.name, titleFont:'inherit', sub:x.sub, badge:null, meta:x.until, action:null}));
    if (s.tab === 'Service desk') rows = s.tickets.filter(x => m(x.name)).map((x, i) => ({
      icon:'support_agent', iconColor:'var(--prim)', title:x.name, titleFont:'inherit', sub:x.sub,
      badge:x.status, badgeBg:meta[x.status][0], badgeFg:meta[x.status][1], meta:x.when,
      action:x.status === 'open' ? 'Close' : 'Reopen', actionColor:'var(--onprimc)',
      act:() => set({tickets: s.tickets.map((y, k) => k === i ? {...y, status: y.status === 'open' ? 'closed' : 'open'} : y)})}));
    return {
      search: s.search, setSearch: (e) => set({search: e.target.value}),
      searchPlaceholder: s.regexMode ? 'Regex search — ' + s.tab.toLowerCase() : 'Search ' + s.tab.toLowerCase(),
      regexBg: s.regexMode ? 'var(--prim)' : 'var(--surfch)', regexFg: s.regexMode ? 'var(--onprim)' : 'var(--onsurfv)',
      toggleRegexMode: () => set({regexMode: !s.regexMode}),
      regexOpen: s.regexOpen, regexInitial: s.regexMode ? s.search : '',
      regexCorpus: [...s.incidents.map(x => x.name), ...s.alerts.map(x => x.name), ...s.errors.map(x => x.name), ...s.tickets.map(x => x.name)],
      openRegexBuilder: () => set({regexOpen: true}), closeRegexBuilder: () => set({regexOpen: false}),
      applyRegex: (p) => set({search: p, regexMode: true, regexOpen: false}),
      paletteOpen: s.paletteOpen, openPalette: () => set({paletteOpen: true}), closePalette: () => set({paletteOpen: false}),
      paletteActions: [{label:'Toggle dark theme', icon:'dark_mode', run: () => { document.body.classList.toggle('dark', !s.dark); set({dark: !s.dark}); }},
        ...['Incidents','Alerts','Errors','On-call','Service desk'].map(t => ({label:'Monitor: ' + t, icon:'monitoring', run: () => set({tab: t})}))],
      toggleDark: () => { document.body.classList.toggle('dark', !s.dark); set({dark: !s.dark}); },
      themeIcon: s.dark ? 'light_mode' : 'dark_mode',
      tabs: ['Incidents','Alerts','Errors','On-call','Service desk'].map(t => ({label:t, pick:() => set({tab:t}),
        bg: s.tab === t ? 'var(--primc)' : 'transparent', fg: s.tab === t ? 'var(--onprimc)' : 'var(--onsurfv)'})),
      rows, emptyList: rows.length === 0
    };
  }
}
</script>
</body>
</html>
