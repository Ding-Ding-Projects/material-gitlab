<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0" rel="stylesheet">
<style>
body{margin:0;font-family:'Google Sans Text',sans-serif;
--surf:#f4effa;--surfc:#ece4f6;--surfch:#e0d5f2;--surfcl:#faf6ff;--onsurf:#1d1b20;--onsurfv:#49454f;
--prim:#6750c4;--onprim:#ffffff;--primc:#e8def8;--onprimc:#4f378b;--sec:#d6c9f0;--outl:#cac4d0;--outlv:#e7e0ec;
--err:#b3261e;--errc:#f9dedc;--good:#1a7f37;--goodc:#dcf2e3;--warn:#9a6700;--warnc:#fff3d0;--card:#ffffff;--scrim:rgba(29,27,32,.35)}
body.dark{--surf:#141218;--surfc:#211f26;--surfch:#2b2831;--surfcl:#1b1922;--onsurf:#e6e0e9;--onsurfv:#cac4d0;
--prim:#cfbdfe;--onprim:#381e72;--primc:#4f378b;--onprimc:#e8def8;--sec:#4a4458;--outl:#49454f;--outlv:#332f3a;
--err:#f2b8b5;--errc:#5c1a17;--good:#7fd79a;--goodc:#1c3a27;--warn:#e2c46d;--warnc:#3d3012;--card:#211f26;--scrim:rgba(0,0,0,.5)}
a{color:var(--prim);text-decoration:none}a:hover{color:var(--onprimc)}
input::placeholder{color:var(--onsurfv);opacity:.7}
.material-symbols-outlined{font-variation-settings:'opsz' 20,'wght' 400;font-size:20px;user-select:none}
</style>
</helmet>
<div style="display:flex;height:100vh;background:var(--surf);color:var(--onsurf);overflow:hidden">
  <dc-import name="Sidebar" active="Epics & roadmap" hint-size="248px,100%" style="height:100%"></dc-import>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header data-screen-label="Top bar" style="display:flex;align-items:center;gap:12px;padding:12px 24px 8px">
      <div style="flex:1;max-width:600px;display:flex;align-items:center;gap:10px;background:var(--surfc);border-radius:999px;padding:8px 8px 8px 18px;color:var(--onsurfv)">
        <span class="material-symbols-outlined">search</span>
        <input onInput="{{ setSearch }}" value="{{ search }}" placeholder="{{ searchPlaceholder }}" style="border:none;outline:none;background:transparent;font:inherit;color:var(--onsurf);flex:1">
        <div onClick="{{ toggleRegexMode }}" title="Regex mode" style="padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;font-family:monospace;background:{{ regexBg }};color:{{ regexFg }}">.*</div>
        <div onClick="{{ openRegexBuilder }}" title="Regex builder" style="width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:var(--surfch)"><span class="material-symbols-outlined" style="font-size:18px">construction</span></div>
      </div>
      <div onClick="{{ openPalette }}" title="Command palette (Ctrl+Shift+F)" style="width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--onsurfv)" style-hover="background:var(--surfch)"><span class="material-symbols-outlined">keyboard_command_key</span></div>
      <div onClick="{{ toggleDark }}" title="Toggle theme" style="width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--onsurfv)" style-hover="background:var(--surfch)"><span class="material-symbols-outlined">{{ themeIcon }}</span></div>
      <div style="width:36px;height:36px;border-radius:999px;background:var(--primc);color:var(--onprimc);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">JD</div>
    </header>
    <div style="display:flex;align-items:center;gap:12px;padding:8px 24px">
      <h1 style="margin:0;font-family:'Google Sans';font-size:24px;font-weight:500">Epics & roadmap</h1>
      <span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--warnc);color:var(--warn);letter-spacing:.5px">ULTIMATE</span>
      <div style="margin-left:auto;display:flex;background:var(--surfc);border-radius:999px;padding:3px;gap:2px">
        <div onClick="{{ setTree }}" style="padding:7px 18px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;background:{{ treeBg }};color:{{ treeFg }}">Epic tree</div>
        <div onClick="{{ setRoadmap }}" style="padding:7px 18px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;background:{{ roadBg }};color:{{ roadFg }}">Roadmap</div>
      </div>
    </div>
    <sc-if value="{{ isTree }}" hint-placeholder-val="{{ true }}">
      <main style="flex:1;overflow-y:auto;padding:8px 24px 24px">
        <div style="background:var(--card);border-radius:var(--card-r,20px);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);max-width:920px">
          <sc-for list="{{ treeRows }}" as="ep" hint-placeholder-count="6">
            <div style="display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid var(--outlv);padding-left:{{ ep.indent }}">
              <div onClick="{{ ep.toggle }}" style="width:26px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--onsurfv)" style-hover="background:var(--surfch)"><span class="material-symbols-outlined" style="font-size:18px">{{ ep.chevron }}</span></div>
              <span class="material-symbols-outlined" style="color:{{ ep.iconColor }};font-size:19px">{{ ep.icon }}</span>
              <div style="flex:1;min-width:0">
                <div style="font-weight:500;font-size:13.5px">{{ ep.title }}</div>
                <div style="font-size:12px;color:var(--onsurfv);margin-top:1px">{{ ep.ref }} · {{ ep.dates }}</div>
              </div>
              <div style="width:130px;display:flex;flex-direction:column;gap:4px">
                <div style="height:6px;border-radius:999px;background:var(--surfch);overflow:hidden"><div style="height:100%;border-radius:999px;background:var(--prim);width:{{ ep.pct }}"></div></div>
                <span style="font-size:11px;color:var(--onsurfv)">{{ ep.pct }} · {{ ep.counts }}</span>
              </div>
              <span style="font-size:11.5px;font-weight:500;padding:3px 12px;border-radius:999px;background:{{ ep.stateBg }};color:{{ ep.stateFg }}">{{ ep.state }}</span>
            </div>
          </sc-for>
        </div>
      </main>
    </sc-if>
    <sc-if value="{{ isRoadmap }}" hint-placeholder-val="{{ false }}">
      <main data-screen-label="Roadmap" style="flex:1;overflow:auto;padding:8px 24px 24px">
        <div style="background:var(--card);border-radius:var(--card-r,20px);padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.08);min-width:820px">
          <div style="display:grid;grid-template-columns:220px repeat(6,1fr);gap:0;border-bottom:1px solid var(--outlv);padding-bottom:8px;margin-bottom:6px">
            <span></span>
            <sc-for list="{{ months }}" as="mo" hint-placeholder-count="6">
              <span style="font-size:11.5px;font-weight:700;color:var(--onsurfv);text-transform:uppercase;letter-spacing:.5px;text-align:center">{{ mo }}</span>
            </sc-for>
          </div>
          <sc-for list="{{ roadmapRows }}" as="rr" hint-placeholder-count="5">
            <div style="display:grid;grid-template-columns:220px repeat(6,1fr);align-items:center;height:44px">
              <span style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:12px">{{ rr.title }}</span>
              <div style="grid-column:2 / span 6;position:relative;height:26px">
                <div title="{{ rr.dates }}" style="position:absolute;top:0;height:26px;border-radius:999px;background:{{ rr.barBg }};left:{{ rr.left }};width:{{ rr.width }};display:flex;align-items:center;padding:0 12px;overflow:hidden">
                  <span style="font-size:11px;font-weight:500;color:{{ rr.barFg }};white-space:nowrap">{{ rr.pct }}</span>
                </div>
              </div>
            </div>
          </sc-for>
        </div>
      </main>
    </sc-if>
  </div>
  <sc-if value="{{ regexOpen }}" hint-placeholder-val="{{ false }}">
    <dc-import name="Regex Builder" initial="{{ regexInitial }}" corpus="{{ regexCorpus }}" corpus-title="Matches in epics" on-apply="{{ applyRegex }}" on-close="{{ closeRegexBuilder }}" hint-size="0px,0px"></dc-import>
  </sc-if>
  <sc-if value="{{ paletteOpen }}" hint-placeholder-val="{{ false }}">
    <dc-import name="Command Palette" actions="{{ paletteActions }}" on-close="{{ closePalette }}" hint-size="0px,0px"></dc-import>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    dark: false, search: '', regexMode: false, regexOpen: false, paletteOpen: false, view: 'tree',
    collapsed: {},
    epics: [
      {id:1, ref:'&12', title:'Material 3 UI rewrite', state:'Open', start:1, len:5, pct:62, counts:'21/34', children:[
        {id:2, ref:'&14', title:'Token layer and theming', state:'Closed', start:1, len:2, pct:100, counts:'8/8'},
        {id:3, ref:'&15', title:'Issues & boards surfaces', state:'Open', start:2, len:2, pct:70, counts:'7/10'},
        {id:4, ref:'&16', title:'MR & pipeline surfaces', state:'Open', start:3, len:3, pct:38, counts:'6/16'}
      ]},
      {id:5, ref:'&18', title:'Regex search everywhere', state:'Open', start:2, len:3, pct:45, counts:'5/11', children:[
        {id:6, ref:'&19', title:'Shared builder component', state:'Closed', start:2, len:1, pct:100, counts:'4/4'},
        {id:7, ref:'&20', title:'Per-surface adoption', state:'Open', start:3, len:2, pct:14, counts:'1/7'}
      ]},
      {id:8, ref:'&22', title:'Agent memory integration', state:'Open', start:4, len:3, pct:10, counts:'1/10', children:[]}
    ]
  };
  componentDidMount() {
    this._key = (e) => {
      if (e.ctrlKey && e.shiftKey && (e.key === 'F' || e.key === 'f')) { e.preventDefault(); this.setState({paletteOpen: true}); }
      if (e.key === 'Escape') this.setState({paletteOpen: false, regexOpen: false});
    };
    window.addEventListener('keydown', this._key);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this._key); }
  matcher() {
    const q = this.state.search;
    if (!q) return () => true;
    if (this.state.regexMode) { try { const re = new RegExp(q, 'i'); return (t) => re.test(t); } catch { return () => true; } }
    const lq = q.toLowerCase(); return (t) => t.toLowerCase().includes(lq);
  }
  renderVals() {
    const s = this.state, set = (o) => this.setState(o);
    const m = this.matcher();
    const rows = [];
    s.epics.forEach(ep => {
      const kids = (ep.children || []).filter(c => m(c.title + ' ' + c.ref));
      if (!m(ep.title + ' ' + ep.ref) && kids.length === 0) return;
      rows.push({...ep, depth: 0, hasKids: (ep.children || []).length > 0});
      if (!s.collapsed[ep.id]) kids.forEach(c => rows.push({...c, depth: 1, hasKids: false}));
    });
    const flat = [];
    s.epics.forEach(ep => { flat.push(ep); (ep.children || []).forEach(c => flat.push(c)); });
    const mk = (ep) => ({
      title: ep.title, ref: ep.ref, pct: ep.pct + '%', counts: ep.counts,
      dates: 'Mar → ' + ['','Mar','Apr','May','Jun','Jul','Aug'][Math.min(6, ep.start + ep.len - 1)] + ' 2026',
      state: ep.state,
      stateBg: ep.state === 'Open' ? 'var(--goodc)' : 'var(--surfch)', stateFg: ep.state === 'Open' ? 'var(--good)' : 'var(--onsurfv)',
      icon: ep.state === 'Open' ? 'flag' : 'check_circle', iconColor: ep.state === 'Open' ? 'var(--prim)' : 'var(--onsurfv)'
    });
    return {
      search: s.search, setSearch: (e) => set({search: e.target.value}),
      searchPlaceholder: s.regexMode ? 'Regex search — epics' : 'Search epics',
      regexBg: s.regexMode ? 'var(--prim)' : 'var(--surfch)', regexFg: s.regexMode ? 'var(--onprim)' : 'var(--onsurfv)',
      toggleRegexMode: () => set({regexMode: !s.regexMode}),
      regexOpen: s.regexOpen, regexInitial: s.regexMode ? s.search : '',
      regexCorpus: flat.map(e => e.ref + '  ' + e.title),
      openRegexBuilder: () => set({regexOpen: true}), closeRegexBuilder: () => set({regexOpen: false}),
      applyRegex: (p) => set({search: p, regexMode: true, regexOpen: false}),
      paletteOpen: s.paletteOpen, openPalette: () => set({paletteOpen: true}), closePalette: () => set({paletteOpen: false}),
      paletteActions: [{label: 'Toggle dark theme', icon: 'dark_mode', run: () => { document.body.classList.toggle('dark', !s.dark); set({dark: !s.dark}); }},
        {label: 'Switch to roadmap', icon: 'timeline', run: () => set({view: 'roadmap'})}],
      toggleDark: () => { document.body.classList.toggle('dark', !s.dark); set({dark: !s.dark}); },
      themeIcon: s.dark ? 'light_mode' : 'dark_mode',
      isTree: s.view === 'tree', isRoadmap: s.view === 'roadmap',
      setTree: () => set({view: 'tree'}), setRoadmap: () => set({view: 'roadmap'}),
      treeBg: s.view === 'tree' ? 'var(--primc)' : 'transparent', treeFg: s.view === 'tree' ? 'var(--onprimc)' : 'var(--onsurfv)',
      roadBg: s.view === 'roadmap' ? 'var(--primc)' : 'transparent', roadFg: s.view === 'roadmap' ? 'var(--onprimc)' : 'var(--onsurfv)',
      treeRows: rows.map(ep => ({...mk(ep),
        indent: (20 + ep.depth * 34) + 'px',
        chevron: ep.hasKids ? (s.collapsed[ep.id] ? 'chevron_right' : 'expand_more') : '',
        toggle: () => ep.hasKids && set({collapsed: {...s.collapsed, [ep.id]: !s.collapsed[ep.id]}})})),
      months: ['Mar','Apr','May','Jun','Jul','Aug'],
      roadmapRows: flat.filter(e => m(e.title + ' ' + e.ref)).map(ep => ({...mk(ep),
        left: ((ep.start - 1) / 6 * 100) + '%', width: (ep.len / 6 * 100) + '%',
        barBg: ep.state === 'Closed' ? 'var(--surfch)' : ep.pct > 50 ? 'var(--prim)' : 'var(--sec)',
        barFg: ep.state === 'Closed' ? 'var(--onsurfv)' : ep.pct > 50 ? 'var(--onprim)' : 'var(--onprimc)'}))
    };
  }
}
</script>
</body>
</html>
