<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ close }}" style="position:fixed;inset:0;background:var(--scrim,rgba(29,27,32,.35));z-index:60;display:flex;justify-content:center;padding-top:80px;align-items:flex-start">
  <div onClick="{{ stop }}" data-screen-label="Command palette" style="width:560px;background:var(--surf,#f4effa);border-radius:24px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.3);font-family:'Google Sans Text',sans-serif;color:var(--onsurf,#1d1b20)">
    <div style="display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--outlv)">
      <span class="material-symbols-outlined" style="color:var(--onsurfv)">search</span>
      <input onInput="{{ setQuery }}" value="{{ query }}" placeholder="Jump to page, setting, or action…" style="border:none;outline:none;background:transparent;font:inherit;font-size:14.5px;color:var(--onsurf);flex:1">
      <span style="font-size:11px;color:var(--onsurfv);border:1px solid var(--outl);border-radius:6px;padding:2px 7px">Ctrl+Shift+F</span>
    </div>
    <div style="max-height:340px;overflow-y:auto;padding:8px">
      <sc-for list="{{ results }}" as="pr" hint-placeholder-count="6">
        <a href="{{ pr.href }}" onClick="{{ pr.act }}" style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;font-size:13.5px;color:var(--onsurf)" style-hover="background:var(--surfc)">
          <span class="material-symbols-outlined" style="color:var(--onsurfv)">{{ pr.icon }}</span>{{ pr.label }}
          <span style="margin-left:auto;font-size:11.5px;color:var(--onsurfv)">{{ pr.kind }}</span>
        </a>
      </sc-for>
      <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
        <div style="padding:20px;text-align:center;font-size:13px;color:var(--onsurfv)">No matches.</div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 720, &quot;height&quot;: 520}, &quot;actions&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;{label: string, icon?: string, run: () =&gt; void}[]&quot;}, &quot;onClose&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { query: '' };
  renderVals() {
    const s = this.state;
    const pages = [
      ['Issues','list_alt','Issues.dc.html'],['Merge requests','call_merge','Merge Requests.dc.html'],
      ['Pipelines','conveyor_belt','Pipelines.dc.html'],['Repository','code','Repository.dc.html'],
      ['Code: branches, commits, tags','account_tree','Code.dc.html'],
      ['Build: jobs, editor, schedules','construction','Build.dc.html'],
      ['Plan: milestones, wiki','flag','Plan.dc.html'],
      ['Deploy: releases, flags, registry','new_releases','Deploy.dc.html'],
      ['Operate: environments, k8s','cloud','Operate.dc.html'],
      ['Monitor: incidents, alerts','monitoring','Monitor.dc.html'],
      ['Analyze: value stream, insights','conversion_path','Analyze.dc.html'],
      ['Secure: dependencies, audit','policy','Secure.dc.html'],
      ['Settings','settings','Settings.dc.html'],['Epics & roadmap','map','Epics.dc.html'],
      ['Security dashboard','security','Security.dc.html'],['To-Do list','done_all','Todos.dc.html'],
      ['Manage: activity, labels','history','Manage.dc.html'],
      ['Admin area','admin_panel_settings','Admin.dc.html'],['Sign in','login','Login.dc.html'],
      ['Agent Memory console','memory','Agent Memory.dc.html']
    ];
    const actions = this.props.actions ?? [];
    const all = [...pages.map(p => ({label:p[0], icon:p[1], href:p[2], kind:'Page'})),
      ...actions.map(a => ({label:a.label, icon:a.icon || 'bolt', href:'#', kind:'Action', run:a.run}))];
    const q = s.query.toLowerCase();
    const results = all.filter(r => !q || r.label.toLowerCase().includes(q)).map(r => ({...r,
      act: (e) => { if (r.run) { e.preventDefault(); r.run(); } this.props.onClose && this.props.onClose(); }}));
    return { query: s.query, setQuery: (e) => this.setState({query: e.target.value}),
      results, empty: results.length === 0,
      close: () => this.props.onClose && this.props.onClose(), stop: (e) => e.stopPropagation() };
  }
}
</script>
</body>
</html>
