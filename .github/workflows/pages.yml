name: Publish Pages site

on:
  # The site is only ever published from main, so only main needs to run this.
  # Firing on every branch queued a build per feature push behind a single
  # serialised concurrency group, where a stale branch could fail and leave a red
  # result for work that was never going to be published.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Scans published files for internal shorthand that must not appear in a
      # public repository. The term list is private and is not available to a
      # hosted runner, so this step reports that it skipped rather than
      # pretending to have checked. Its real bite is local, before a push.
      - name: Check published files for internal shorthand
        run: node scripts/verify-public-vocabulary.mjs

      - name: Run the site completeness check
        working-directory: site
        run: node scripts/completeness-check.mjs

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site with relative asset paths
        working-directory: site
        run: npm run build -- --base=./

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    # Build validates every branch, but only main is ever published. Without this
    # gate a push to any feature branch deployed that branch straight to the live
    # site, which is how unreviewed work reached the published Pages destination.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
