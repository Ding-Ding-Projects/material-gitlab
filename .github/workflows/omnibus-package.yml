name: Omnibus package

# Builds a Debian package of THIS fork, so that installing it gets you the Material
# work rather than stock upstream GitLab.
#
# Deliberately manual. A full Omnibus build compiles Ruby, PostgreSQL, Redis, nginx and
# the Go components from source. It is enormous, and running it on every push would be
# both useless and rude to the runner pool.
#
# Honesty about the state of this workflow: it has not yet produced a package. It is
# committed so the work is real and reviewable rather than described in a roadmap, and
# so its failures are visible. The two things most likely to stop it on a hosted runner
# are disk and wall clock; both are checked and reported explicitly rather than being
# left to fail as something obscure two hours in.

on:
  workflow_dispatch:
    inputs:
      omnibus_ref:
        description: 'omnibus-gitlab ref to build with (must match this tree)'
        required: true
        default: '19.3.0+ce.0'
      gitlab_ref:
        description: 'Ref of this fork to package. Defaults to the triggering commit.'
        required: false
        default: ''
      attach_to_release:
        description: 'Attach the resulting .deb to a GitHub release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Never cancel in progress: this workflow publishes, so a half-finished run that is
  # killed can leave a tag or an asset behind.
  group: omnibus-package-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  build-package:
    runs-on: ubuntu-24.04
    # 360 minutes is the GitHub hosted runner ceiling for one job. An Omnibus build can
    # legitimately need more than this on 4 cores, which is a real risk, not a defect.
    timeout-minutes: 360

    steps:
      - name: Check out this fork at the exact ref to package
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.gitlab_ref || github.sha }}
          fetch-depth: 0

      - name: Record what is being packaged
        id: target
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          version="$(tr -d '[:space:]' < VERSION)"
          echo "sha=$sha"          >> "$GITHUB_OUTPUT"
          echo "version=$version"  >> "$GITHUB_OUTPUT"
          echo "Packaging $sha at declared version $version"
          echo "Building with omnibus-gitlab ${{ inputs.omnibus_ref }}"

      - name: Reclaim runner disk before starting
        shell: bash
        run: |
          set -euo pipefail
          echo "Before:"; df -h / | tail -1
          # A hosted runner ships several toolchains this build never touches. Removing
          # them is the difference between roughly 20 GB free and roughly 50 GB free.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          echo "After:"; df -h / | tail -1
          avail_gb="$(df -BG --output=avail / | tail -1 | tr -dc '0-9')"
          echo "Available: ${avail_gb} GB"
          if [ "$avail_gb" -lt 25 ]; then
            echo "::error::Only ${avail_gb} GB free. An Omnibus build needs far more than this and would fail late and confusingly. Stopping now."
            exit 1
          fi

      - name: Check out omnibus-gitlab at the matching ref
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.omnibus_ref }}" \
            https://gitlab.com/gitlab-org/omnibus-gitlab.git omnibus-gitlab
          cd omnibus-gitlab
          git log -1 --format='omnibus-gitlab at %H %s'

      - name: Point the gitlab-rails component at this fork
        shell: bash
        run: |
          set -euo pipefail
          cd omnibus-gitlab
          # Omnibus resolves each component's git remote through .custom_sources.yml.
          # Repointing gitlab-rails at this repository is what makes the resulting
          # package carry the Material work instead of upstream's application code.
          test -f .custom_sources.yml || { echo "::error::.custom_sources.yml is missing; the omnibus layout has changed and this step needs revisiting."; exit 1; }
          cp .custom_sources.yml .custom_sources.yml.orig
          python3 - <<'PY'
          import re, sys, pathlib
          p = pathlib.Path('.custom_sources.yml')
          text = p.read_text(encoding='utf-8')
          fork = 'https://github.com/Ding-Ding-Projects/material-gitlab.git'
          # Operate on the gitlab-rails block only. The (?=^\S|\Z) lookahead ends the block
          # at the next top level key, which is what keeps gitlab-rails-ee out of range;
          # a plain prefix match would rewrite it too, and the build would then be EE.
          block_re = re.compile(r'(^gitlab-rails:\n)((?:[ \t]+.*\n|\n)*?)(?=^\S|\Z)', re.M)
          m = block_re.search(text)
          if not m:
              sys.exit('gitlab-rails block not found in .custom_sources.yml')
          body = m.group(2)
          changed = 0
          def swap(mm):
              global changed
              changed += 1
              return mm.group(1) + '"' + fork + '"'
          # Both keys must point at the fork. Omnibus reads "alternative" when
          # ALTERNATIVE_SOURCES is set, so rewriting only "remote" can silently build
          # upstream while looking correct.
          for key in ('remote', 'alternative'):
              body, _ = re.subn(r'(^[ \t]+%s:[ \t]*)("[^"]*"|\S+)' % key, swap, body, count=1, flags=re.M)
          if changed != 2:
              sys.exit('Expected to rewrite remote and alternative; rewrote %d' % changed)
          p.write_text(text[:m.start(2)] + body + text[m.end(2):], encoding='utf-8')
          print('gitlab-rails remote and alternative repointed to', fork)
          PY
          echo "--- diff ---"
          diff -u .custom_sources.yml.orig .custom_sources.yml || true

      - name: Route GNU dependency downloads to a mirror that is actually up
        shell: bash
        run: |
          set -euo pipefail
          cd omnibus-gitlab
          # Several dependency tarballs are fetched from ftpmirror.gnu.org, which is a
          # redirector rather than a host. When that redirector is down the build dies part
          # way through compilation: libtool, libiconv and ncurses all failed here with
          # 502 Bad Gateway and read timeouts, 22 minutes in, after real work had been done.
          #
          # This routes around an upstream outage; it does not fix one. It changes where the
          # bytes come from and not which bytes are accepted, because every download is still
          # verified against the checksum in its own software definition. A mirror serving
          # different content would fail the build rather than quietly poison the package.
          candidates=("https://ftpmirror.gnu.org" "https://ftp.gnu.org/gnu" "https://mirrors.kernel.org/gnu")
          chosen=""
          for c in "${candidates[@]}"; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "$c/libtool/" || echo 000)"
            echo "  $c -> $code"
            if [ "$code" = "200" ]; then chosen="$c"; break; fi
          done
          if [ -z "$chosen" ]; then
            echo "::error::No GNU source mirror responded. The build cannot fetch its dependencies and would fail late and confusingly, so it is stopping now."
            exit 1
          fi
          echo "Using $chosen"
          if [ "$chosen" = "https://ftpmirror.gnu.org" ]; then
            echo "The usual redirector is healthy, so the software definitions are left untouched."
            exit 0
          fi
          # grep exits 1 when it matches nothing, and under `set -e -o pipefail` that
          # kills the step. The whole point of the line below is that after a successful
          # substitution there is nothing left to find, so the success case was being
          # treated as a failure. || true on the assignment keeps the count and drops the
          # status; the explicit comparisons underneath are what actually decide.
          before="$(grep -rl 'ftpmirror\.gnu\.org' config/software | wc -l)" || true
          echo "software definitions pointing at the redirector: $before"
          if [ "$before" -eq 0 ]; then
            echo "::warning::Nothing referenced ftpmirror.gnu.org, so no substitution was made. The upstream layout may have changed and this step needs revisiting."
            exit 0
          fi
          # Two URL shapes live in these definitions and they must map differently:
          #   ftpmirror.gnu.org/gnu/ncurses/...  already carries /gnu/
          #   ftpmirror.gnu.org/libtool/...      does not
          # The redirector accepts both. A real GNU host only serves /gnu/<package>/, so one
          # blind prefix swap turns the first shape into /gnu/gnu/ and every fetch 404s. That
          # is precisely what happened on the previous attempt: the 502s went away and were
          # replaced by 404s on the single package using the longer form. Longest form first.
          files="$(grep -rl 'ftpmirror\.gnu\.org' config/software)" || true
          # shellcheck disable=SC2086
          sed -i "s|https://ftpmirror\.gnu\.org/gnu/|$chosen/|g" $files
          # shellcheck disable=SC2086
          sed -i "s|https://ftpmirror\.gnu\.org/|$chosen/|g" $files
          # A doubled path segment is the exact defect above, and it is silent: the build runs
          # for minutes before any fetch is attempted. Catch it here, where it costs seconds.
          if grep -rn '/gnu/gnu/' config/software; then
            echo "::error::Substitution produced a doubled /gnu/gnu/ path, which 404s on every real mirror. Refusing to start a build that cannot fetch anything."
            exit 1
          fi
          after="$(grep -rl 'ftpmirror\.gnu\.org' config/software | wc -l)" || true
          echo "references remaining: $after"
          if [ "$after" -ne 0 ]; then
            echo "::error::Substitution left $after references behind, so the build would still reach the failing host. Refusing to start it."
            exit 1
          fi
          echo "--- rewritten ---"
          grep -rn "$chosen" config/software | head -8 || true

      - name: Read the toolchain versions this upstream ref declares
        id: omnibusvars
        shell: bash
        run: |
          set -euo pipefail
          cd omnibus-gitlab
          # config/software/openssl.rb chooses between OpenSSL 1.1.1 and 3.x purely on whether
          # OPENSSL_VERSION starts with "3". Unset means 1.1.1, and curl at this ref refuses to
          # configure against anything below 3.0.0. The result is a build that fetches and
          # compiles happily for 25 minutes and then dies on "OpenSSL 3.0.0 or upper required",
          # with nothing anywhere naming the variable that was never set.
          #
          # Read the value from the ref's own CI variables rather than hard coding it, so it
          # stays correct when the ref moves instead of silently going stale.
          f=gitlab-ci-config/variables.yml
          test -f "$f" || { echo "::error::$f is missing, so the toolchain versions this ref expects cannot be read. The omnibus layout may have changed."; exit 1; }
          ver="$(grep -oE '^[[:space:]]*OPENSSL_VERSION:[[:space:]]*[0-9][0-9.]*' "$f" | head -1 | awk '{print $2}')" || true
          if [ -z "${ver:-}" ]; then
            echo "::error::No OPENSSL_VERSION found in $f. Guessing one would build the wrong OpenSSL and fail far later, so this stops here."
            exit 1
          fi
          case "$ver" in
            3*) : ;;
            *) echo "::error::This ref declares OPENSSL_VERSION=$ver, which selects the 1.1.1 definition that curl will reject."; exit 1 ;;
          esac
          echo "openssl_version=$ver" >> "$GITHUB_OUTPUT"
          echo "This ref expects OpenSSL $ver"

      - name: Build the package in the official omnibus builder image
        shell: bash
        env:
          GITLAB_VERSION: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          # The official builder image carries the exact toolchain omnibus expects.
          # Installing those dependencies by hand on a bare runner is a reliable way to
          # fail slowly for reasons that have nothing to do with this fork.
          builder="registry.gitlab.com/gitlab-org/gitlab-omnibus-builder/ubuntu_24.04:latest"
          docker pull "$builder"
          # Without this, the gitlab-rails definition takes its "copy the assets a CI
          # job already built" path and syncs "$CI_PROJECT_DIR/$ASSET_PATH" into
          # public/assets. Outside GitLab own CI both variables are empty, so that path
          # collapses to "/" and it copies the entire filesystem root into the package.
          # It ran for 43 seconds doing exactly that before dying trying to recreate
          # /usr/bin inside public/assets. Compiling the assets here is the correct route
          # and the only one available, since there is no upstream job to copy from.
          docker run --rm \
            -e GITLAB_VERSION \
            -e OMNIBUS_REF="${{ inputs.omnibus_ref }}" \
            -e OPENSSL_VERSION="${{ steps.omnibusvars.outputs.openssl_version }}" \
            -e COMPILE_ASSETS=true \
            -e BUILD_VERSION="${{ steps.target.outputs.version }}" \
            -v "$PWD/omnibus-gitlab:/omnibus" \
            -w /omnibus \
            "$builder" \
            bash -lc '
              set -euo pipefail
              # The checkout is owned by the runner user and this container runs as root,
              # so git refuses to read it: "detected dubious ownership in repository".
              # Omnibus derives its version from `git describe --tags --exact-match`, so
              # without this the build dies before compiling anything, with an error that
              # names git rather than ownership.
              git config --global --add safe.directory /omnibus
              git config --global --add safe.directory "*"

              # That describe also needs the tag itself, which a shallow branch clone does
              # not always bring along. Create it locally when it is missing rather than
              # letting omnibus fail on an empty version.
              if ! git -C /omnibus describe --tags --exact-match >/dev/null 2>&1; then
                echo "no exact tag on HEAD; creating ${OMNIBUS_REF} locally so omnibus can version the build"
                git -C /omnibus tag -f "${OMNIBUS_REF}" HEAD
              fi
              git -C /omnibus describe --tags --exact-match

              bundle config set --local path /omnibus/.bundle-vendor
              bundle install --jobs 4

              # Omnibus fetches every dependency source over the network, and a single
              # upstream 502 kills the whole build: the first run past the ownership fix
              # died on "NetFetcher: libffi ... 502 Bad Gateway". Omnibus caches software
              # it has already built, so a retry resumes rather than starting over.
              # Three attempts, and the exit status of the last one is what counts.
              attempt=1
              until bundle exec omnibus build gitlab --log-level=info; do
                status=$?
                if [ "$attempt" -ge 3 ]; then
                  echo "::error::omnibus build failed $attempt times; last exit $status"
                  exit "$status"
                fi
                echo "::warning::omnibus build attempt $attempt failed with exit $status; retrying after a pause"
                attempt=$((attempt + 1))
                sleep 60
              done
            '

      - name: Verify a real package was produced
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(omnibus-gitlab/pkg/*.deb)
          if [ ${#debs[@]} -eq 0 ]; then
            echo "::error::The build finished without producing a .deb. Nothing will be published."
            exit 1
          fi
          for d in "${debs[@]}"; do
            echo "=== $d ==="
            ls -l "$d"
            dpkg-deb --info "$d" | head -20
            sha256sum "$d"
          done
          echo "deb_count=${#debs[@]}" >> "$GITHUB_OUTPUT"

      - name: Upload the package as a build artifact
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: omnibus-deb-${{ steps.target.outputs.sha }}
          path: omnibus-gitlab/pkg/*.deb
          if-no-files-found: warn
          retention-days: 14

      - name: Attach the package to a release
        if: ${{ inputs.attach_to_release && steps.verify.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ steps.target.outputs.sha }}"
          tag="omnibus-${{ steps.target.outputs.version }}-${sha:0:12}"
          {
            echo "## Omnibus package"
            echo
            echo "Debian package built from this fork, so installing it gets you the Material"
            echo "work rather than stock upstream GitLab."
            echo
            echo "- Target commit: $sha"
            echo "- Declared version: ${{ steps.target.outputs.version }}"
            echo "- Built with omnibus-gitlab: ${{ inputs.omnibus_ref }}"
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "sudo apt-get install -y curl openssh-server ca-certificates tzdata perl"
            echo "sudo EXTERNAL_URL=\"http://gitlab.example.com\" dpkg -i <package>.deb"
            echo '```'
            echo
            echo "The package is unsigned. Code signing is deliberately disabled in this project."
          } > release-notes.md
          gh release create "$tag" \
            --repo '${{ github.repository }}' \
            --target "$sha" \
            --title "Omnibus ${{ steps.target.outputs.version }}" \
            --notes-file release-notes.md \
            omnibus-gitlab/pkg/*.deb
          gh release view "$tag" --repo '${{ github.repository }}' --json tagName,isDraft,assets
