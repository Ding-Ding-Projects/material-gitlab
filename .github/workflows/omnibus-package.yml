name: Omnibus package

# Builds a Debian package of THIS fork, so that installing it gets you the Material work
# rather than stock upstream GitLab, then builds the official-layout container image from
# that package and pushes it to GHCR.
#
# Deliberately manual. A full Omnibus build compiles Ruby, PostgreSQL, Redis, nginx and
# the Go components from source. It is enormous, and running it on every push would be
# both useless and rude to the runner pool.
#
# Every shell step calls a committed script under scripts/omnibus/. The scripts are the
# single implementation, so a local run on a Linux Docker host and this workflow cannot
# drift apart. History of this workflow, recorded because none of it was visible from the
# error it produced: eight runs failed for seven distinct causes. The last one, run
# 34239883194, compiled the entire package in about two hours and failed only at the final
# health check on musl-linked node binaries that upstream deletes only in EE builds.
# scripts/omnibus/patch-frontend-islands-cleanup.sh is that fix.
#
# Run 34309060466 failed on a deterministic webpack compile error, but the retry logic at the
# time retried on ANY failure: scripts/omnibus/build-package-inner.sh looped up to three whole
# `omnibus build gitlab` invocations, and the omnibus gem itself retried the failing command a
# further two times on top of that (scripts/omnibus/patch-build-retries.sh explains and
# disables that inner retry). One deterministic error cost roughly nine compiles at about 30
# minutes each, and the job hit the 360-minute runner ceiling and was cancelled without ever
# reporting the real error clearly. scripts/omnibus/retry.sh is that fix: it retries only when
# a failed attempt's log actually looks like a transient network problem.

on:
  workflow_dispatch:
    inputs:
      omnibus_ref:
        description: 'omnibus-gitlab ref to build with (must match this tree)'
        required: true
        default: '19.3.0+ce.0'
      gitlab_ref:
        description: 'Ref of this fork to package. Defaults to the triggering commit.'
        required: false
        default: ''
      attach_to_release:
        description: 'Publish the .deb on a new GitHub release'
        type: boolean
        default: true
      push_image:
        description: 'Build the container image from the .deb and push it to GHCR'
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

concurrency:
  # Never cancel in progress: this workflow publishes, so a half-finished run that is
  # killed can leave a tag or an asset behind.
  group: omnibus-package-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  build-package:
    runs-on: ubuntu-24.04
    # 360 minutes is the GitHub hosted runner ceiling for one job. Run 34239883194 reached
    # the health check after about 2h05m, so the ceiling is a real risk, not a defect.
    timeout-minutes: 360
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      sha12: ${{ steps.target.outputs.sha12 }}
      version: ${{ steps.target.outputs.version }}
      image_ref: ${{ steps.target.outputs.image_ref }}
      image_latest: ${{ steps.target.outputs.image_latest }}
      deb_name: ${{ steps.verify.outputs.deb_name }}
      deb_sha256: ${{ steps.verify.outputs.deb_sha256 }}
      deb_bytes: ${{ steps.verify.outputs.deb_bytes }}
      release_tag: ${{ steps.publish.outputs.release_tag }}
      deb_url: ${{ steps.publish.outputs.deb_url }}

    steps:
      - name: Check out this fork at the exact ref to package
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.gitlab_ref || github.sha }}
          fetch-depth: 0

      - name: Record when this run started
        id: timing
        shell: bash
        run: |
          set -euo pipefail
          started="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .run_started_at)"
          if [ -z "$started" ]; then
            echo "::error::GitHub Actions run metadata did not provide run_started_at."
            exit 1
          fi
          echo "workflow_started=$started" >> "$GITHUB_OUTPUT"
          echo "Workflow started at $started"

      - name: Record what is being packaged
        id: target
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          sha12="${sha:0:12}"
          version="$(tr -d '[:space:]' < VERSION)"
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "sha=$sha"
            echo "sha12=$sha12"
            echo "version=$version"
            echo "image_ref=ghcr.io/${owner}/material-gitlab:${version}-${sha12}"
            echo "image_latest=ghcr.io/${owner}/material-gitlab:latest"
          } >> "$GITHUB_OUTPUT"
          echo "Packaging $sha at declared version $version"
          echo "Building with omnibus-gitlab ${{ inputs.omnibus_ref }}"

      - name: Reclaim runner disk before starting
        shell: bash
        run: |
          set -euo pipefail
          echo "Before:"; df -h / | tail -1
          # A hosted runner ships several toolchains this build never touches. Removing
          # them is the difference between roughly 20 GB free and roughly 50 GB free.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          echo "After:"; df -h / | tail -1
          avail_gb="$(df -BG --output=avail / | tail -1 | tr -dc '0-9')"
          echo "Available: ${avail_gb} GB"
          if [ "$avail_gb" -lt 25 ]; then
            echo "::error::Only ${avail_gb} GB free. An Omnibus build needs far more than this and would fail late and confusingly. Stopping now."
            exit 1
          fi

      - name: Check out omnibus-gitlab at the matching ref
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.omnibus_ref }}" \
            https://gitlab.com/gitlab-org/omnibus-gitlab.git omnibus-gitlab
          git -C omnibus-gitlab log -1 --format='omnibus-gitlab at %H %s'

      - name: Point the gitlab-rails component at this fork
        shell: bash
        run: scripts/omnibus/repoint-sources.sh omnibus-gitlab "https://github.com/${{ github.repository }}.git"

      - name: Make the frontend-islands node_modules cleanup unconditional
        shell: bash
        run: scripts/omnibus/patch-frontend-islands-cleanup.sh omnibus-gitlab

      - name: Install dev dependencies for the from-scratch asset compile
        shell: bash
        run: scripts/omnibus/patch-assets-install.sh omnibus-gitlab

      - name: Stop the omnibus gem retrying a deterministic build failure
        shell: bash
        run: scripts/omnibus/patch-build-retries.sh omnibus-gitlab

      - name: Route GNU dependency downloads to a mirror that is actually up
        shell: bash
        run: scripts/omnibus/route-gnu-mirror.sh omnibus-gitlab

      - name: Read the toolchain versions this upstream ref declares
        id: omnibusvars
        shell: bash
        run: scripts/omnibus/read-toolchain.sh omnibus-gitlab

      - name: Build the package in the official omnibus builder image
        shell: bash
        env:
          OMNIBUS_DIR: omnibus-gitlab
          OMNIBUS_REF: ${{ inputs.omnibus_ref }}
          GITLAB_VERSION: ${{ steps.target.outputs.sha }}
          BUILD_VERSION: ${{ steps.target.outputs.version }}
          OPENSSL_VERSION: ${{ steps.omnibusvars.outputs.openssl_version }}
        run: scripts/omnibus/build-package.sh

      - name: Verify a real package of this fork was produced
        id: verify
        shell: bash
        run: scripts/omnibus/verify-package.sh omnibus-gitlab/pkg "${{ steps.target.outputs.version }}"

      - name: Upload the package as a build artifact
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: omnibus-deb-${{ steps.target.outputs.sha }}
          path: |
            omnibus-gitlab/pkg/*.deb
            omnibus-gitlab/pkg/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Count the lines this release ships
        id: linecount
        if: ${{ steps.verify.outcome == 'success' && inputs.attach_to_release }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/line-count"
          out="$RUNNER_TEMP/line-count/LINE-COUNT.json"
          # --no-blame is deliberate for this repository. Surviving-line authorship needs
          # one git blame per tracked text file, and the squashed upstream import means
          # there are over 100,000 of them. The counter records attribution as skipped
          # rather than inventing a number.
          node scripts/release/line_count.mjs --json --no-blame "--revision=${{ steps.target.outputs.sha }}" > "$out"
          echo "line_count_path=$out" >> "$GITHUB_OUTPUT"
          sha256sum "$out"

      - name: Resolve a published dim-sum code name and photo
        id: dimsum
        if: ${{ steps.verify.outcome == 'success' && inputs.attach_to_release }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $catalogUrl = 'https://raw.githubusercontent.com/Ding-Ding-Projects/dim-sum-photos/main/catalog/index.json'
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'GH_TOKEN is empty, so the dim-sum catalog calls would be unauthenticated and rate limited. Refusing to start.'
          }
          $apiHeaders = @{
            'User-Agent'    = 'material-gitlab-omnibus-package'
            Accept          = 'application/vnd.github+json'
            Authorization   = "Bearer $env:GH_TOKEN"
          }
          $catalogPath = Join-Path $env:RUNNER_TEMP 'dim-sum-catalog.json'
          Invoke-WebRequest -UseBasicParsing -Headers $apiHeaders -Uri $catalogUrl -OutFile $catalogPath
          $catalog = Get-Content -Raw -LiteralPath $catalogPath | ConvertFrom-Json
          $assets = @()
          $maxReleasePages = 10
          for ($releasePage = 1; $releasePage -le $maxReleasePages; $releasePage++) {
            $releases = @(Invoke-RestMethod -Headers $apiHeaders -Uri "https://api.github.com/repos/Ding-Ding-Projects/dim-sum-photos/releases?per_page=100&page=$releasePage")
            $assets += @($releases |
              Where-Object { $_.tag_name -match '^catalog-v1(?:$|-)' } |
              ForEach-Object { $_.assets } |
              Where-Object { $_.name -match '^hk-dish-\d{4}-.+\.(png|jpg|jpeg)$' })
            if ($releases.Count -lt 100) { break }
          }
          if (-not $assets) { throw 'No published catalog-v1 photo assets were found.' }
          $prior = Invoke-RestMethod -Headers $apiHeaders -Uri "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100"
          $used = (($prior | ForEach-Object { $_.body }) -join "`n")
          $chosen = $null
          foreach ($dish in $catalog.dishes) {
            $leaf = [IO.Path]::GetFileName($dish.image.path)
            $asset = $assets | Where-Object { $_.name -eq $leaf } | Select-Object -First 1
            $code = "$($dish.name.en) · $($dish.name.zhHant)"
            if ($asset -and $used -notmatch [regex]::Escape($code)) { $chosen = [pscustomobject]@{ Dish = $dish; Asset = $asset; Code = $code }; break }
          }
          if (-not $chosen) { throw 'No unused catalog dish with a published photo asset is available.' }
          $photoPath = Join-Path $env:RUNNER_TEMP $chosen.Asset.name
          Invoke-WebRequest -UseBasicParsing -Headers $apiHeaders -Uri $chosen.Asset.browser_download_url -OutFile $photoPath
          $bytes = [IO.File]::ReadAllBytes($photoPath)
          $extension = [IO.Path]::GetExtension($chosen.Asset.name).ToLowerInvariant()
          $isPng = $bytes.Length -ge 8 -and $bytes[0] -eq 0x89 -and $bytes[1] -eq 0x50 -and $bytes[2] -eq 0x4e -and $bytes[3] -eq 0x47 -and $bytes[4] -eq 0x0d -and $bytes[5] -eq 0x0a -and $bytes[6] -eq 0x1a -and $bytes[7] -eq 0x0a
          $isJpeg = $bytes.Length -ge 3 -and $bytes[0] -eq 0xff -and $bytes[1] -eq 0xd8 -and $bytes[2] -eq 0xff
          if (($extension -eq '.png' -and -not $isPng) -or ($extension -in '.jpg','.jpeg' -and -not $isJpeg)) { throw "Published dim-sum photo signature does not match $extension." }
          "code_name=$($chosen.Code)" >> $env:GITHUB_OUTPUT
          "photo_url=$($chosen.Asset.browser_download_url)" >> $env:GITHUB_OUTPUT
          "photo_path=$photoPath" >> $env:GITHUB_OUTPUT

      - name: Prepare release notes and verify timing
        id: notes
        if: ${{ steps.verify.outcome == 'success' && inputs.attach_to_release && steps.dimsum.outcome == 'success' }}
        shell: bash
        env:
          WORKFLOW_STARTED: ${{ steps.timing.outputs.workflow_started }}
          SHA: ${{ steps.target.outputs.sha }}
          SHA12: ${{ steps.target.outputs.sha12 }}
          VERSION: ${{ steps.target.outputs.version }}
          OMNIBUS_REF: ${{ inputs.omnibus_ref }}
          DEB_NAME: ${{ steps.verify.outputs.deb_name }}
          DEB_SHA256: ${{ steps.verify.outputs.deb_sha256 }}
          DEB_BYTES: ${{ steps.verify.outputs.deb_bytes }}
          WEBPACK_FILES: ${{ steps.verify.outputs.webpack_files }}
          IMAGE_REF: ${{ steps.target.outputs.image_ref }}
          PUSH_IMAGE: ${{ inputs.push_image }}
          DIM_SUM_CODE: ${{ steps.dimsum.outputs.code_name }}
          DIM_SUM_PHOTO_URL: ${{ steps.dimsum.outputs.photo_url }}
          LINE_COUNT_PATH: ${{ steps.linecount.outputs.line_count_path }}
        run: |
          set -euo pipefail
          completed="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          start_s="$(date -u -d "$WORKFLOW_STARTED" +%s)"
          end_s="$(date -u -d "$completed" +%s)"
          dur=$(( end_s - start_s ))
          duration="$(printf '%02d:%02d:%02d' $((dur/3600)) $(((dur%3600)/60)) $((dur%60)))"
          tag="omnibus-${VERSION}-${SHA12}"
          repo="${{ github.repository }}"
          deb_url="https://github.com/${repo}/releases/download/${tag}/${DEB_NAME}"
          line_sha="$(sha256sum "$LINE_COUNT_PATH" | awk '{print $1}')"
          counted_files="$(jq -r .counted.files "$LINE_COUNT_PATH")"
          counted_total="$(jq -r .counted.total "$LINE_COUNT_PATH")"
          counted_nonblank="$(jq -r .counted.nonBlank "$LINE_COUNT_PATH")"
          grand_files="$(jq -r .grandTotal.files "$LINE_COUNT_PATH")"
          grand_total="$(jq -r .grandTotal.total "$LINE_COUNT_PATH")"
          excluded_files="$(jq -r .exclusions.files "$LINE_COUNT_PATH")"
          attribution="$(jq -r 'if .attribution.skipped then "Surviving-line authorship was not computed for this release: " + .attribution.reason else "Agent-written lines: " + (.attribution.agentLines|tostring) + " (rule: " + .attribution.rule + ")" end' "$LINE_COUNT_PATH")"
          bucket_rows="$(jq -r '.counted.buckets | to_entries | sort_by(.key) | .[] | "| \(.key) | \(.value.files) | \(.value.total) | \(.value.nonBlank) |"' "$LINE_COUNT_PATH")"
          notes="$RUNNER_TEMP/omnibus-release-notes.md"
          {
            echo "## Omnibus package"
            echo
            echo "Debian package built from this fork, so installing it gets you the Material work rather than stock upstream GitLab."
            echo
            echo "- Target commit: \`$SHA\`"
            echo "- Declared version: \`$VERSION\`"
            echo "- Built with omnibus-gitlab: \`$OMNIBUS_REF\`"
            echo "- Dim-sum code name: **$DIM_SUM_CODE**"
            echo "- Photo: $DIM_SUM_PHOTO_URL"
            echo
            echo "### Package"
            echo
            echo "| Asset | Bytes | SHA-256 |"
            echo "| --- | ---: | --- |"
            echo "| \`$DEB_NAME\` | $DEB_BYTES | \`$DEB_SHA256\` |"
            echo
            echo "The package carries this fork's \`app/helpers/material_*_helper.rb\` files, its compiled fork-only \`pages.agent_memory\` entry, and $WEBPACK_FILES compiled webpack files; all were verified by opening the package before publication. Omnibus never ships app/assets source, so the Material source files are not in the package, only their compiled output."
            echo
            echo "### Install with Docker"
            echo
            echo '```bash'
            echo "git clone https://github.com/${repo}.git && cd material-gitlab"
            echo "git checkout $SHA"
            echo "printf 'GITLAB_HOSTNAME=gitlab.example.internal\nGITLAB_HTTP_PORT=8929\nGITLAB_SSH_PORT=2229\nGITLAB_HOME=/srv/material-gitlab\n' > .env"
            echo "MATERIAL_GITLAB_DEB_URL='$deb_url' MATERIAL_GITLAB_VERSION='${VERSION}-${SHA12}' docker compose build"
            echo "docker compose up -d"
            echo "docker inspect --format '{{.State.Health.Status}}' material-gitlab   # wait for healthy"
            echo '```'
            echo
            echo "### Install the package directly on Debian or Ubuntu"
            echo
            echo '```bash'
            echo "sudo apt-get install -y curl openssh-server ca-certificates tzdata perl"
            echo "curl -fLo $DEB_NAME '$deb_url'"
            echo "echo '$DEB_SHA256  $DEB_NAME' | sha256sum -c"
            echo "sudo EXTERNAL_URL='http://gitlab.example.internal' dpkg -i $DEB_NAME"
            echo '```'
            echo
            echo "### Container image"
            echo
            if [ "$PUSH_IMAGE" = "true" ]; then
              echo "The build-image job of this run builds \`$IMAGE_REF\` from this package, boots it, verifies it is this fork, and pushes it. That job appends the pushed digest to these notes after a verified push. If no digest section follows, the image was not pushed."
            else
              echo "Image publication was not requested for this run. Build it locally with the Docker steps above."
            fi
            echo
            echo "### Workflow timing (UTC)"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Workflow started | $WORKFLOW_STARTED |"
            echo "| Workflow completed | $completed |"
            echo "| Workflow duration | $duration |"
            echo
            echo "### Committed line-count report"
            echo
            echo "| Bucket | Files | Total lines | Non-blank |"
            echo "| --- | --- | --- | --- |"
            echo "$bucket_rows"
            echo "| **Counted total** | **$counted_files** | **$counted_total** | **$counted_nonblank** |"
            echo "| **Grand total, including excluded** | **$grand_files** | **$grand_total** | |"
            echo
            echo "Excluded files: $excluded_files. $attribution"
            echo
            echo "The complete machine-readable report is attached as LINE-COUNT.json (SHA-256 $line_sha). Reproduce locally with: node scripts/release/line_count.mjs --json --revision=$SHA"
            echo
            echo "### Honest limits"
            echo
            echo "- The package is unsigned. Code signing is deliberately disabled in this project."
            echo "- No tests, lint, type checks, or static analysis ran in this workflow."
            echo "- This is an EE-layout source tree built under the CE omnibus project. The instance runs as the Free tier; features that need a paid tier show their normal licence prompts."
            echo "- The package name and version come from omnibus-gitlab \`$OMNIBUS_REF\`; the application code is this fork at the target commit above."
          } > "$notes"
          if [ "$(wc -c < "$notes")" -gt 120000 ]; then
            echo "::error::Release body exceeds the GitHub limit; trim the summary instead of inlining a report."
            exit 1
          fi
          echo "notes_path=$notes" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          cat "$notes"

      - name: Publish one unique non-draft release
        id: publish
        if: ${{ steps.notes.outcome == 'success' }}
        shell: bash
        env:
          TAG: ${{ steps.notes.outputs.release_tag }}
          NOTES: ${{ steps.notes.outputs.notes_path }}
          SHA: ${{ steps.target.outputs.sha }}
          SHA12: ${{ steps.target.outputs.sha12 }}
          VERSION: ${{ steps.target.outputs.version }}
          DEB_PATH: ${{ steps.verify.outputs.deb_path }}
          DEB_NAME: ${{ steps.verify.outputs.deb_name }}
          DEB_BYTES: ${{ steps.verify.outputs.deb_bytes }}
          LINE_COUNT_PATH: ${{ steps.linecount.outputs.line_count_path }}
          PHOTO_PATH: ${{ steps.dimsum.outputs.photo_path }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          if gh release view "$TAG" --repo "$repo" >/dev/null 2>&1; then
            echo "::error::Release tag $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$repo" \
            --target "$SHA" \
            --title "Omnibus $VERSION ($SHA12)" \
            --notes-file "$NOTES" \
            "$DEB_PATH" omnibus-gitlab/pkg/SHA256SUMS.txt "$LINE_COUNT_PATH" "$PHOTO_PATH"
          release="$(gh api "repos/$repo/releases/tags/$TAG")"
          draft="$(jq -r .draft <<<"$release")"
          target="$(jq -r .target_commitish <<<"$release")"
          if [ "$draft" != "false" ] || [ "$target" != "$SHA" ]; then
            echo "::error::Published release did not resolve to the exact non-draft target commit (draft=$draft target=$target)."
            exit 1
          fi
          size="$(jq -r --arg n "$DEB_NAME" '.assets[] | select(.name == $n) | .size' <<<"$release")"
          if [ "$size" != "$DEB_BYTES" ]; then
            echo "::error::Published package size $size does not match the verified $DEB_BYTES bytes."
            exit 1
          fi
          url="$(jq -r --arg n "$DEB_NAME" '.assets[] | select(.name == $n) | .browser_download_url' <<<"$release")"
          code="$(curl -sSIL -o /dev/null -w '%{http_code}' "$url")"
          if [ "$code" != "200" ]; then
            echo "::error::The published package URL answered HTTP $code rather than 200: $url"
            exit 1
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "deb_url=$url" >> "$GITHUB_OUTPUT"
          gh release view "$TAG" --repo "$repo" --json tagName,isDraft,assets

  build-image:
    needs: build-package
    # Runs whenever a verified package exists, even if publishing the release failed. The
    # image installs the package from the uploaded artifact, not from the release, so a
    # release-only failure (GitHub refuses assets of 2 GiB or more, for example) must not
    # also cost the container image after a two hour build.
    if: ${{ always() && inputs.push_image && needs.build-package.outputs.deb_sha256 != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      IMAGE_REF: ${{ needs.build-package.outputs.image_ref }}
      IMAGE_LATEST: ${{ needs.build-package.outputs.image_latest }}
      VERSION: ${{ needs.build-package.outputs.version }}
      SHA12: ${{ needs.build-package.outputs.sha12 }}

    steps:
      - name: Check out this fork at the exact ref that was packaged
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-package.outputs.sha }}

      - name: Download the verified package
        uses: actions/download-artifact@v4
        with:
          name: omnibus-deb-${{ needs.build-package.outputs.sha }}
          path: deploy/docker/packages

      - name: Confirm the downloaded package is the verified one
        shell: bash
        env:
          DEB_NAME: ${{ needs.build-package.outputs.deb_name }}
          DEB_SHA256: ${{ needs.build-package.outputs.deb_sha256 }}
        run: |
          set -euo pipefail
          ls -l deploy/docker/packages
          echo "$DEB_SHA256  deploy/docker/packages/$DEB_NAME" | sha256sum -c

      - name: Build the image from the package
        shell: bash
        env:
          DEB_URL: ${{ needs.build-package.outputs.deb_url }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg RELEASE_VERSION="${VERSION}-${SHA12}" \
            --build-arg DOWNLOAD_URL="${DEB_URL}" \
            -t "$IMAGE_REF" -t "$IMAGE_LATEST" \
            deploy/docker
          docker image ls "$IMAGE_REF"

      - name: Boot the image and prove it is this fork
        shell: bash
        run: |
          set -euo pipefail
          rails=/opt/gitlab/embedded/service/gitlab-rails
          docker run -d --name smoke --shm-size 256m -p 8929:80 \
            -e GITLAB_OMNIBUS_CONFIG="external_url 'http://127.0.0.1:8929'; nginx['listen_port'] = 80; nginx['listen_https'] = false; gitlab_rails['gitlab_shell_ssh_port'] = 2229" \
            "$IMAGE_REF"
          healthy=0
          for i in $(seq 1 120); do
            if docker exec smoke /opt/gitlab/bin/gitlab-healthcheck --fail --max-time 10 >/dev/null 2>&1; then healthy=1; break; fi
            if [ "$(docker inspect --format '{{.State.Running}}' smoke)" != "true" ]; then break; fi
            sleep 10
          done
          if [ "$healthy" != "1" ]; then
            echo "::error::The image did not become healthy within 20 minutes."
            docker logs smoke 2>&1 | tail -120
            exit 1
          fi
          code="$(curl -s -o /tmp/sign_in.html -w '%{http_code}' http://127.0.0.1:8929/users/sign_in)"
          if [ "$code" != "200" ]; then
            echo "::error::The sign-in page answered HTTP $code."
            docker logs smoke 2>&1 | tail -80
            exit 1
          fi
          docker exec smoke cat "$rails/VERSION" | grep -qx "$VERSION"
          # Omnibus never ships app/assets source, so prove the fork with what does ship: its
          # material helpers and the compiled fork-only agent_memory entry (see verify-package.sh).
          docker exec smoke sh -c "ls $rails/app/helpers/material_*_helper.rb >/dev/null"
          docker exec smoke sh -c "ls $rails/public/assets/webpack/pages.agent_memory.*.chunk.js >/dev/null"
          webpack_files="$(docker exec smoke sh -c "find $rails/public/assets/webpack -type f | wc -l")"
          echo "webpack files in the running image: $webpack_files"
          if [ "$webpack_files" -lt 1000 ]; then
            echo "::error::Only $webpack_files webpack files are present; the compiled frontend did not land."
            exit 1
          fi
          docker rm -f smoke

      - name: Push the image to GHCR
        id: push
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE_REF"
          docker push "$IMAGE_LATEST"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REF")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE_REF as $digest"
          docker manifest inspect "$IMAGE_REF" > /dev/null

      - name: Record the pushed image on the release
        if: ${{ needs.build-package.outputs.release_tag != '' }}
        shell: bash
        env:
          TAG: ${{ needs.build-package.outputs.release_tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          body="$RUNNER_TEMP/release-body.md"
          gh release view "$TAG" --repo "$repo" --json body --jq .body > "$body"
          {
            echo
            echo "### Container image, pushed and verified"
            echo
            echo "- Image: \`$IMAGE_REF\`"
            echo "- Also tagged: \`$IMAGE_LATEST\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Boot check: the image started on the runner, answered its own health check, served the sign-in page, and carries this fork's application tree and compiled frontend."
            echo
            echo "Pull it with \`docker pull $IMAGE_REF\` once the package is public on GHCR; until then, build locally from the package with the Docker steps above."
          } >> "$body"
          gh release edit "$TAG" --repo "$repo" --notes-file "$body"
          gh release view "$TAG" --repo "$repo" --json body --jq .body | grep -F "$DIGEST" > /dev/null
