# Runs Material GitLab: the GitLab CE package built from THIS fork, in the official
# Omnibus container layout. See README.md, section "Install with Docker", for the steps.
#
# Two ways to get the image:
#   docker compose pull            pulls the published image named in MATERIAL_GITLAB_IMAGE
#   docker compose build           builds it locally from a release .deb; set
#                                  MATERIAL_GITLAB_DEB_URL to the release asset URL, or drop
#                                  the .deb under deploy/docker/packages/ first
#
# Configure it through a .env file next to this file (never commit that file):
#   GITLAB_HOSTNAME=gitlab.example.internal     name or address clients will use
#   GITLAB_HTTP_PORT=8929                       host port for HTTP
#   GITLAB_SSH_PORT=2229                        host port for Git over SSH
#   GITLAB_HOME=/srv/material-gitlab            where config, logs and data persist
#   GITLAB_ROOT_PASSWORD=...                    first-boot password for root (optional)
#   GITLAB_MEMORY_LIMIT=10g                     container memory ceiling
#
# The stock upstream comparison baseline lives in deploy/upstream-baseline/.

services:
  gitlab:
    image: ${MATERIAL_GITLAB_IMAGE:-ghcr.io/ding-ding-projects/material-gitlab:latest}
    build:
      context: ./deploy/docker
      args:
        RELEASE_VERSION: ${MATERIAL_GITLAB_VERSION:-local}
        DOWNLOAD_URL: ${MATERIAL_GITLAB_DEB_URL:-}
    container_name: material-gitlab
    restart: unless-stopped
    hostname: '${GITLAB_HOSTNAME:-gitlab.example.internal}'
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://${GITLAB_HOSTNAME:-gitlab.example.internal}:${GITLAB_HTTP_PORT:-8929}'
        # The container still listens on 80; only the advertised URL carries the host port.
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        # Container port 22 is remapped below, so tell GitLab which port to advertise in
        # the clone URLs it shows users.
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2229}
      # Read by the first-boot seed only. Leave it unset to get a generated password in
      # /etc/gitlab/initial_root_password, which the package deletes after 24 hours.
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD:-}
    ports:
      - '${GITLAB_HTTP_PORT:-8929}:80'
      - '${GITLAB_SSH_PORT:-2229}:22'
    volumes:
      # Persist configuration, logs and application data outside the container so an
      # image upgrade does not discard the instance.
      - '${GITLAB_HOME:-./gitlab-data}/config:/etc/gitlab'
      - '${GITLAB_HOME:-./gitlab-data}/logs:/var/log/gitlab'
      - '${GITLAB_HOME:-./gitlab-data}/data:/var/opt/gitlab'
    # GitLab's bundled PostgreSQL needs more shared memory than Docker's 64 MB default.
    shm_size: '256m'
    mem_limit: ${GITLAB_MEMORY_LIMIT:-10g}
    # The image defines its own HEALTHCHECK through gitlab-healthcheck. Watch it with:
    #   docker inspect --format '{{.State.Health.Status}}' material-gitlab
