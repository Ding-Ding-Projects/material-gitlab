# Runs an upstream GitLab CE instance.
#
# This deploys the official gitlab/gitlab-ce image. It does NOT deploy the Material
# Design overlay in this repository; see the README for what that overlay actually is.
#
# Set GITLAB_HOME before use, for example:
#   export GITLAB_HOME=/srv/gitlab
#   export GITLAB_HOSTNAME=gitlab.example.com
#
# To run it on a remote host over SSH, point the Docker CLI at that host instead of
# copying this file there:
#   docker context create gitlab-host --docker "host=ssh://deploy@docker.example.internal"
#   docker context use gitlab-host
#   docker compose up -d
#
# Minimum practical sizing is 4 GB of RAM; 8 GB is comfortable. The first boot
# takes several minutes before the instance answers on its port.

services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    restart: always
    hostname: '${GITLAB_HOSTNAME:-gitlab.example.com}'
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://${GITLAB_HOSTNAME:-gitlab.example.com}'
        # Container port 22 is remapped below, so tell GitLab which port to advertise
        # in the clone URLs it shows users.
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
    ports:
      - '80:80'
      - '443:443'
      - '2224:22'
    volumes:
      # Persist configuration, logs and application data outside the container so an
      # image upgrade does not discard the instance.
      - '${GITLAB_HOME:-./gitlab}/config:/etc/gitlab'
      - '${GITLAB_HOME:-./gitlab}/logs:/var/log/gitlab'
      - '${GITLAB_HOME:-./gitlab}/data:/var/opt/gitlab'
    # GitLab's bundled PostgreSQL needs more shared memory than Docker's 64 MB default.
    shm_size: '256m'
    healthcheck:
      test: ['CMD', 'sh', '-c', 'curl -fsS http://localhost/-/health || exit 1']
      interval: 60s
      timeout: 10s
      retries: 10
      start_period: 10m
